# デプロイされているアプリの一覧を出す入口のページ。クラスタの HTTPRoute を読むだけの権限を持つ
apiVersion: v1
kind: ServiceAccount
metadata:
  name: portal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: showcase-portal
rules:
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - httproutes
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: showcase-portal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: showcase-portal
subjects:
- kind: ServiceAccount
  name: portal
  namespace: app-portal
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: portal
data:
  server.py: |
    """クラスタの HTTPRoute を読み、デプロイされているアプリの一覧を出す"""
    import html
    import json
    import ssl
    import time
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    SA = "/var/run/secrets/kubernetes.io/serviceaccount"
    API = "https://kubernetes.default.svc/apis/gateway.networking.k8s.io/v1/httproutes"
    cache = {"at": 0.0, "hosts": []}


    def hosts() -> list[str]:
        # API サーバを叩きすぎないよう、10 秒だけ覚えておく
        if time.time() - cache["at"] > 10:
            token = open(f"{SA}/token").read()
            req = urllib.request.Request(API, headers={"Authorization": f"Bearer {token}"})
            routes = json.load(urllib.request.urlopen(req, context=ssl.create_default_context(cafile=f"{SA}/ca.crt"), timeout=5))["items"]
            cache["hosts"] = sorted({h for r in routes if r["metadata"]["namespace"].startswith("app-")
                                     for h in r["spec"].get("hostnames") or []})
            cache["at"] = time.time()
        return cache["hosts"]


    def page(names: list[str]) -> str:
        items = "".join(f'<li><a href="https://{html.escape(h)}/">{html.escape(h.split(".")[0])}</a></li>' for h in names)
        return f"""<!doctype html><html lang="ja"><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1"><title>OSS Showcase</title>
    <style>body{{font-family:system-ui,sans-serif;max-width:40rem;margin:2rem auto;padding:0 1rem;line-height:1.6}}
    ul{{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(11rem,1fr));gap:.75rem}}
    a{{display:block;padding:.75rem 1rem;border:1px solid #ccc;border-radius:.5rem;text-decoration:none;color:inherit}}
    a:hover{{border-color:#326ce5}}</style></head><body>
    <h1>OSS Showcase</h1><p>CloudNative Days のわいわい広場の Kubernetes で動いているアプリです。
    <a style="display:inline;padding:0;border:0;color:#326ce5" href="https://github.com/cloudnativedaysjp/oss-showcase">あなたのアプリも PR で載せられます</a>。</p>
    <ul>{items}</ul></body></html>"""


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            try:
                body, code = page([h for h in hosts() if not h.startswith("portal.")]).encode(), 200
            except Exception:
                body, code = "一覧を読めませんでした".encode(), 503
            self.send_response(code)
            self.send_header("Content-Type", "text/html; charset=utf-8")
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *args):
            pass


    ThreadingHTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
    spec:
      serviceAccountName: portal
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
      - name: portal
        image: python:3.13-alpine
        command:
        - python3
        - /app/server.py
        ports:
        - containerPort: 8080
        securityContext:
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /
            port: 8080
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: app
          mountPath: /app
      volumes:
      - name: app
        configMap:
          name: portal
---
apiVersion: v1
kind: Service
metadata:
  name: portal
spec:
  selector:
    app: portal
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portal
spec:
  parentRefs:
  - name: showcase
    namespace: gateway
  hostnames:
  - portal.showcase.cloudnativedays.jp
  rules:
  - backendRefs:
    - name: portal
      port: 80

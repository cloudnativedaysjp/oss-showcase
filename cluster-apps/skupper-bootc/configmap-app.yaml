apiVersion: v1
kind: ConfigMap
metadata:
  name: skupper-bootc-app
data:
  server.py: |
    #!/usr/bin/env python3
    """会場の Kubernetes にデプロイするデモアプリ。

    画面を配り、リモートの Fedora の状態を見ている全員に同じ内容で届け、
    切り替えの要求を 1 つずつリモートへ取り次ぐ。

      GET  /api/state?c=<id>   全員に共通の状態。c は「いま見ている人数」を数えるための目印
      POST /api/switch         {"target": "<id>", "c": "<id>"} をリモートの API へ取り次ぐ

    リモートへの問い合わせは、見ている人数に関係なくこのアプリが 1 秒に 1 回だけ行う。
    切り替えの進み具合（どの段階にいつ入ったか）もここで決めるので、
    誰の画面でも同じタイミングで同じ表示になる。

    標準ライブラリだけで動く。
    """

    import json
    import os
    import re
    import sys
    import threading
    import time
    import urllib.error
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from pathlib import Path

    # Skupper の Listener が作る Service。この先にリモートの Fedora の API がある
    AGENT_URL = os.environ.get("AGENT_URL", "http://bootc-agent:8088").rstrip("/")
    LISTEN = os.environ.get("LISTEN", "0.0.0.0:8080")
    STATIC_DIR = Path(os.environ.get("STATIC_DIR") or Path(__file__).resolve().parent.parent / "web").resolve()
    REMOTE_PLACE = os.environ.get("REMOTE_PLACE", "")
    HUB_LABEL = os.environ.get("HUB_LABEL", "ROSA 上の Skupper")
    # リモートの VM のコンソール画面（PNG）を返す URL。これも Skupper の Listener の先にある。空なら使わない
    CONSOLE_URL = os.environ.get("CONSOLE_URL", "")
    POLL_SEC = float(os.environ.get("POLL_SEC", "1"))

    LOADING_SEC = 6      # 起動してからこの時間は「確認中」。過ぎても届かなければ「届かない」とする
    ARRIVED_SEC = 30     # 切り替えが終わったことを知らせる表示を続ける時間
    VIEWER_TTL = 6       # この時間、問い合わせがなければ見ていないとみなす
    EVENTS_MAX = 30
    OFFLINE_MAX_SEC = 150  # 再起動にしては長すぎる、と判断する時間。超えたら「届かない」に切り替える
    VIEWERS_MAX = 5000   # 覚えておく目印の上限。作り物の目印を大量に送られても、際限なく増やさない
    MAX_CONNECTIONS = 256  # 同時に相手をする接続の上限。超えた接続はすぐに閉じる
    CONSOLE_FRESH_SEC = 12  # この時間、新しい画面を取れていなければ「中継なし」として扱う
    BEATS_MAX = 90       # 往復時間を覚えておく数。1 秒に 1 回なので、およそ 90 秒ぶん
    BOOTS_MAX = 6
    CLIENT_ID = re.compile(r"^[0-9a-f]{8}$")

    # 画面に出す呼び名。入力させると何でも書けてしまうので、目印から機械的に決める。
    # 画面側（index.html）の同じ並びと揃えること
    ADJECTIVES = ["すばやい", "のんびり", "まじめな", "ねむたい", "げんきな", "しずかな", "おしゃれな", "くいしんぼうの"]
    CATS = ["三毛猫", "黒猫", "白猫", "茶トラ", "サバトラ", "ハチワレ", "キジトラ", "サビ猫"]


    def nickname(client_id):
        if not client_id or not CLIENT_ID.match(client_id):
            return None
        n = int(client_id[:4], 16)
        return ADJECTIVES[n % len(ADJECTIVES)] + CATS[(n >> 3) % len(CATS)]


    def call_agent(path, body=None, timeout=4):
        """リモートの API を呼ぶ。返り値は (HTTP の状態, 本文)。届かなければ例外。"""
        data = json.dumps(body).encode() if body is not None else None
        request = urllib.request.Request(
            AGENT_URL + path, data=data, method="POST" if data else "GET",
            headers={"Content-Type": "application/json"} if data else {},
        )
        try:
            with urllib.request.urlopen(request, timeout=timeout) as response:
                return response.status, json.loads(response.read())
        except urllib.error.HTTPError as error:
            try:
                return error.code, json.loads(error.read())
            except ValueError:
                return error.code, {}


    class Hub:
        def __init__(self):
            self.lock = threading.Lock()
            self.post_lock = threading.Lock()   # 切り替えの取り次ぎは 1 つずつ
            self.started_at = time.time()
            self.remote = None                  # 最後に取れたリモートの状態
            self.fetched_at = 0.0
            self.reachable = False
            self.down_since = None
            self.phase = "loading"
            self.phase_since = self.started_at
            self.run = None                     # 進行中、または直近の切り替え。時刻はこのアプリの時計
            self.events = []
            self.viewers = {}
            self.viewer_count = 0
            self.beats = []                     # リモートまでの往復にかかった時間（ミリ秒）。届かなかった回は None
            self.boots = []                     # これまでに見た起動。boot ID が変わったら、再起動したということ
            self.evidence = None                # リモートで実行したコマンドの、そのままの出力
            self.evidence_boot = None
            self.evidence_busy = False
            self.console_frame = None           # VM のコンソール画面の最新の 1 枚（PNG）
            self.console_etag = ""
            self.console_at = 0.0               # 最後に中継と話せた時刻

        # ---- リモートへの問い合わせ

        def poll(self):
            sent = time.time()
            try:
                status, body = call_agent("/api/status", timeout=3)
                if status != 200:
                    raise RuntimeError(f"status {status}")
            except Exception:
                body = None
            latency = round((time.time() - sent) * 1000)
            fetch_boot = None
            with self.lock:
                now = time.time()
                self.beats = (self.beats + [latency if body is not None else None])[-BEATS_MAX:]
                self.viewers = {k: v for k, v in self.viewers.items() if now - v < VIEWER_TTL}
                self.viewer_count = len(self.viewers)
                if body is not None:
                    run = self.run
                    if (self._running() and sent < run["t_start"] and body["switch"]["phase"] == "idle"
                            and (body.get("last") or {}).get("started_at") != run["op"]):
                        # この応答は、切り替えを頼む前に出した問い合わせへの返事。画面を「切り替え前」に戻さない
                        body["switch"] = self.remote["switch"]
                    self.remote = body
                    self.fetched_at = now
                    self.reachable = True
                    self.down_since = None
                    booted = body.get("booted") or {}
                    boot_id = booted.get("boot_id")
                    if boot_id and (not self.boots or self.boots[0]["boot_id"] != boot_id):
                        self.boots = ([{
                            "boot_id": boot_id, "target": booted.get("target"), "os": booted.get("os"),
                            "kernel": booted.get("kernel"), "boot_time": booted.get("boot_time"), "seen_at": now,
                        }] + self.boots)[:BOOTS_MAX]
                    if boot_id != self.evidence_boot and body["switch"]["phase"] == "idle" and not self.evidence_busy:
                        self.evidence_busy = True
                        fetch_boot = boot_id
                elif self.reachable or self.down_since is None:
                    self.reachable = False
                    self.down_since = now
                self._advance(now)
            if fetch_boot:
                # 取得に時間がかかっても、状態の見張りを止めない
                threading.Thread(target=self._fetch_evidence, args=(fetch_boot,), daemon=True).start()

        def _fetch_evidence(self, boot_id):
            try:
                status, evidence = call_agent("/api/evidence", timeout=25)
                ok = status == 200 and not evidence.get("pending")
            except Exception:
                ok = False
            with self.lock:
                self.evidence_busy = False
                # 取っている間にまた再起動していたら、古い起動の内容なので捨てる
                if ok and self.boots and self.boots[0]["boot_id"] == boot_id:
                    self.evidence = evidence
                    self.evidence_boot = boot_id

        def poll_console(self):
            headers = {"If-None-Match": f'"{self.console_etag}"'} if self.console_etag else {}
            try:
                with urllib.request.urlopen(urllib.request.Request(CONSOLE_URL, headers=headers), timeout=3) as response:
                    frame = response.read(2_000_000)
                    etag = (response.headers.get("ETag") or "").strip('"')
                with self.lock:
                    self.console_frame, self.console_etag, self.console_at = frame, etag, time.time()
            except urllib.error.HTTPError as error:
                if error.code == 304:       # 画面が変わっていない
                    with self.lock:
                        self.console_at = time.time()
            except Exception:
                pass

        def console_forever(self):
            while True:
                started = time.time()
                self.poll_console()
                # 切り替えの最中は細かく、何も起きていないときはゆっくり取りにいく
                busy = self.phase in ("staging", "rebooting", "offline", "arrived")
                time.sleep(max(0.2, (1.5 if busy else 5) - (time.time() - started)))

        def poll_forever(self):
            while True:
                started = time.time()
                try:
                    self.poll()
                except Exception as error:      # 1 回の失敗で見張りを止めない
                    print(f"poll failed: {error!r}", file=sys.stderr)
                time.sleep(max(0.1, POLL_SEC - (time.time() - started)))

        # ---- 段階の決定

        def _label(self, target_id):
            for target in (self.remote or {}).get("targets", []):
                if target["id"] == target_id:
                    return target["label"]
            return "別のイメージ"

        def _event(self, kind, text, now):
            self.events = ([{"t": now, "kind": kind, "text": text}] + self.events)[:EVENTS_MAX]

        def _running(self):
            return self.run is not None and "result" not in self.run

        def _phase_now(self, now):
            remote = self.remote
            if remote is None:
                return "lost" if now - self.started_at > LOADING_SEC else "loading"
            agent_phase = remote["switch"]["phase"]
            if not self.reachable:
                # 切り替えの途中で届かなくなったのなら、再起動に入ったということ。
                # ただし再起動にしては長すぎるなら、マシンか回線に何かあったとみなす
                switching = agent_phase != "idle" or self._running()
                return "offline" if switching and now - (self.down_since or now) < OFFLINE_MAX_SEC else "lost"
            if agent_phase in ("staging", "rebooting"):
                return agent_phase
            run = self.run
            if run and run.get("result") == "ok" and now - run["t_back"] < ARRIVED_SEC:
                return "arrived"
            return "idle"

        def _advance(self, now):
            remote = self.remote
            if remote is not None and self.reachable:
                switch = remote["switch"]
                if switch["phase"] != "idle":
                    # このアプリを通らずに始まった切り替え（このアプリの再起動をまたいだ場合も含む）
                    if not self.run or self.run["op"] != switch.get("started_at"):
                        self._begin_run(switch.get("target"), switch.get("from"), None, now, switch.get("started_at"))
                elif self._running():
                    self._finish_run(remote.get("last"), now)

            phase = self._phase_now(now)
            if phase == self.phase:
                return
            previous, self.phase, self.phase_since = self.phase, phase, now
            run = self.run
            if phase == "rebooting" and run:
                run.setdefault("t_staged", now)
                self._event("reboot", "次に起動するイメージを設定しました。再起動します。", now)
            elif phase == "offline" and run:
                run.setdefault("t_staged", now)
                run.setdefault("t_offline", now)
                self._event("offline", "リモートの Fedora が再起動に入りました。", now)
            elif phase == "lost" and previous not in ("loading", "lost"):
                self._event("lost", "リモートの Fedora に届かなくなりました。", now)
            elif previous == "lost" and phase in ("idle", "arrived"):
                self._event("recovered", "リモートの Fedora に届くようになりました。", now)

        def _begin_run(self, target, source, by, now, op):
            # op は、リモートが切り替えを受け付けた時刻。同じ切り替えかどうかを、この値で見分ける
            self.run = {"id": round(now * 1000), "op": op, "target": target, "from": source, "by": by, "t_start": now}
            self._event("start", self._start_text(by, target), now)

        def _start_text(self, by, target):
            who = f"{by} さん" if by else "誰か"
            return f"{who}が {self._label(target)} への切り替えを始めました。"

        def _finish_run(self, last, now):
            run = self.run
            if not last or last.get("started_at") != run["op"]:
                return      # まだ結果が出ていない
            run["t_back"] = now
            run["duration_sec"] = round(now - run["t_start"], 1)
            if last.get("result") == "ok" and last.get("to") == run["target"]:
                run["result"] = "ok"
                self._event("arrived", f"{self._label(run['target'])} で起動しました。{round(run['duration_sec'])} 秒かかりました。", now)
            else:
                run["result"] = "failed"
                run["error"] = last.get("error") or "切り替わりませんでした"
                self._event("failed", f"切り替えに失敗しました。{run['error']}", now)

        # ---- 画面からの要求

        def state(self, client_id):
            with self.lock:
                now = time.time()
                if client_id and CLIENT_ID.match(client_id) and (client_id in self.viewers or len(self.viewers) < VIEWERS_MAX):
                    self.viewers[client_id] = now
                remote = self.remote
                cooldown = 0
                if remote:
                    cooldown = max(0, remote.get("cooldown_remaining_sec", 0) - (now - self.fetched_at))
                return {
                    "now": now,
                    "phase": self.phase,
                    "phase_since": self.phase_since,
                    "reachable": self.reachable,
                    "down_since": self.down_since,
                    "remote": remote,
                    "place": REMOTE_PLACE or ((remote or {}).get("site") or {}).get("place", ""),
                    "hub_label": HUB_LABEL,
                    "beats": self.beats,
                    "boots": self.boots,
                    "evidence_boot": self.evidence_boot,
                    # コンソール画面の中継が生きていれば、いまの画面の目印を渡す。画面はこれが変わったときだけ取り直す
                    "console": self.console_etag if now - self.console_at < CONSOLE_FRESH_SEC else None,
                    "cooldown_remaining_sec": round(cooldown, 1),
                    "run": self.run,
                    "events": self.events[:12],
                    # 数えるのは 1 秒に 1 回。開いた直後の自分も数に入るように、少なくとも 1 にする
                    "viewers": max(1, self.viewer_count),
                }

        def request_switch(self, target, client_id):
            # 同時に押された要求のうち、先に来た 1 つだけがリモートへ進む。ほかは待たせずに断る
            if not self.post_lock.acquire(blocking=False):
                return 409, {"error": "busy"}
            try:
                with self.lock:
                    now = time.time()
                    if self.remote is None or not self.reachable:
                        return 409, {"error": "unreachable"}
                    if self.phase not in ("idle", "arrived"):
                        return 409, {"error": "busy"}
                    if self.remote.get("cooldown_remaining_sec", 0) - (now - self.fetched_at) > 0:
                        return 409, {"error": "cooldown"}
                    source = (self.remote.get("booted") or {}).get("target")
                try:
                    status, body = call_agent("/api/switch", {"target": target}, timeout=6)
                except Exception:
                    return 502, {"error": "unreachable"}
                if status == 202:
                    by, op = nickname(client_id), body.get("started_at")
                    with self.lock:
                        now = time.time()
                        if self.run and self.run["op"] == op:
                            # 見張りのほうが先にこの切り替えに気づいていた。誰が始めたかだけを書き足す
                            self.run["by"] = by
                            for event in self.events:
                                if event["kind"] == "start" and event["text"] == self._start_text(None, target):
                                    event["text"] = self._start_text(by, target)
                                    break
                        else:
                            self._begin_run(target, source, by, now, op)
                            if self.remote["switch"]["phase"] == "idle":
                                # 次の問い合わせを待たずに、全員の画面を「切り替え中」に進める
                                self.remote["switch"] = {"phase": "staging", "target": target, "from": source, "started_at": op, "log": []}
                        self._advance(now)
                return status, body
            finally:
                self.post_lock.release()


    class BoundedServer(ThreadingHTTPServer):
        """接続ごとにスレッドを 1 つ使うので、数に上限を付ける。上限を超えた接続は、待たせずに閉じる。"""

        daemon_threads = True
        request_queue_size = 128

        def __init__(self, *args, **kwargs):
            super().__init__(*args, **kwargs)
            self._slots = threading.BoundedSemaphore(MAX_CONNECTIONS)

        def process_request(self, request, client_address):
            if not self._slots.acquire(blocking=False):
                self.shutdown_request(request)
                return
            super().process_request(request, client_address)

        def process_request_thread(self, request, client_address):
            try:
                super().process_request_thread(request, client_address)
            finally:
                self._slots.release()


    STATIC_TYPES = {
        ".html": "text/html; charset=utf-8", ".css": "text/css; charset=utf-8",
        ".js": "text/javascript; charset=utf-8", ".svg": "image/svg+xml",
        ".png": "image/png", ".webp": "image/webp", ".ico": "image/x-icon",
    }


    def make_handler(hub):
        class Handler(BaseHTTPRequestHandler):
            server_version = "skupper-bootc-demo"
            protocol_version = "HTTP/1.1"
            timeout = 30

            def _send(self, code, data, content_type, cache="no-store"):
                self.send_response(code)
                self.send_header("Content-Type", content_type)
                self.send_header("Content-Length", str(len(data)))
                self.send_header("Cache-Control", cache)
                self.send_header("X-Content-Type-Options", "nosniff")
                self.end_headers()
                if self.command != "HEAD":
                    self.wfile.write(data)

            def _json(self, code, body):
                self._send(code, json.dumps(body, ensure_ascii=False).encode(), "application/json; charset=utf-8")

            def do_GET(self):
                path, _, query = self.path.partition("?")
                if path == "/api/state":
                    client_id = dict(pair.partition("=")[::2] for pair in query.split("&")).get("c")
                    return self._json(200, hub.state(client_id))
                if path == "/api/evidence":
                    with hub.lock:
                        evidence = hub.evidence
                    return self._json(200, evidence or {"commands": [], "boot_log": []})
                if path == "/api/console.png":
                    with hub.lock:
                        frame, etag = hub.console_frame, hub.console_etag
                    if frame is None:
                        return self._json(404, {"error": "no_console"})
                    # URL に目印を付けて取りにくるので、同じ URL の中身は変わらない。ブラウザに覚えさせてよい
                    return self._send(200, frame, "image/png", "public, max-age=600")
                if path == "/healthz":
                    return self._json(200, {"ok": True})
                self._static(path)

            do_HEAD = do_GET

            def do_POST(self):
                if self.path.split("?", 1)[0] != "/api/switch":
                    return self._json(404, {"error": "not_found"})
                try:
                    length = int(self.headers.get("Content-Length") or 0)
                except ValueError:
                    length = -1
                if not 0 < length <= 1024:
                    return self._json(400, {"error": "bad_request"})
                try:
                    body = json.loads(self.rfile.read(length))
                    target, client_id = body.get("target"), body.get("c")
                except (ValueError, AttributeError):
                    return self._json(400, {"error": "bad_request"})
                if not isinstance(target, str) or len(target) > 64:
                    return self._json(400, {"error": "bad_request"})
                self._json(*hub.request_switch(target, client_id if isinstance(client_id, str) else None))

            def _static(self, path):
                name = "index.html" if path == "/" else path.lstrip("/")
                file = (STATIC_DIR / name).resolve()
                if STATIC_DIR not in file.parents or not file.is_file() or file.suffix not in STATIC_TYPES:
                    return self._json(404, {"error": "not_found"})
                cache = "no-cache" if file.suffix == ".html" else "public, max-age=3600"
                self._send(200, file.read_bytes(), STATIC_TYPES[file.suffix], cache)

            def log_message(self, fmt, *args):
                # 状態の問い合わせは毎秒来るので、記録するのは操作と失敗だけにする
                if getattr(self, "command", "") == "POST" or not str(args[1] if len(args) > 1 else "").startswith(("2", "3")):
                    sys.stderr.write("%s %s\n" % (self.address_string(), fmt % args))

        return Handler


    def main():
        hub = Hub()
        threading.Thread(target=hub.poll_forever, daemon=True).start()
        if CONSOLE_URL:
            threading.Thread(target=hub.console_forever, daemon=True).start()
        address, _, port = LISTEN.rpartition(":")
        server = BoundedServer((address, int(port)), make_handler(hub))
        print(f"listening on {LISTEN}, remote API at {AGENT_URL}", file=sys.stderr)
        try:
            server.serve_forever()
        except KeyboardInterrupt:
            pass


    if __name__ == "__main__":
        main()

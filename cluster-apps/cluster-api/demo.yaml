# scripts/render_cluster_api.py で生成する。手で書き換えない
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DevClusterTemplate
metadata:
  name: in-memory-cluster
  namespace: app-cluster-api
spec:
  template:
    spec:
      backend:
        inMemory: {}
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlaneTemplate
metadata:
  name: in-memory-control-plane
  namespace: app-cluster-api
spec:
  template:
    spec:
      kubeadmConfigSpec:
        clusterConfiguration:
          apiServer:
            certSANs:
            - localhost
            - 127.0.0.1
            - 0.0.0.0
            - host.docker.internal
        initConfiguration:
          nodeRegistration:
            criSocket: unix:///var/run/containerd/containerd.sock
            kubeletExtraArgs:
            - name: eviction-hard
              value: nodefs.available<0%,nodefs.inodesFree<0%,imagefs.available<0%
        joinConfiguration:
          nodeRegistration:
            criSocket: unix:///var/run/containerd/containerd.sock
            kubeletExtraArgs:
            - name: eviction-hard
              value: nodefs.available<0%,nodefs.inodesFree<0%,imagefs.available<0%
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DevMachineTemplate
metadata:
  name: in-memory-control-plane
  namespace: app-cluster-api
spec:
  template:
    spec:
      backend:
        inMemory:
          vm:
            provisioning:
              startupDuration: 10s
              startupJitter: '0.2'
          node:
            provisioning:
              startupDuration: 2s
              startupJitter: '0.2'
          apiServer:
            provisioning:
              startupDuration: 2s
              startupJitter: '0.2'
          etcd:
            provisioning:
              startupDuration: 2s
              startupJitter: '0.2'
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DevMachineTemplate
metadata:
  name: in-memory-default-worker-machinetemplate
  namespace: app-cluster-api
spec:
  template:
    spec:
      backend:
        inMemory:
          vm:
            provisioning:
              startupDuration: 10s
              startupJitter: '0.2'
          node:
            provisioning:
              startupDuration: 2s
              startupJitter: '0.2'
          apiServer:
            provisioning:
              startupDuration: 2s
              startupJitter: '0.2'
          etcd:
            provisioning:
              startupDuration: 2s
              startupJitter: '0.2'
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: in-memory-default-worker-bootstraptemplate
  namespace: app-cluster-api
spec:
  template:
    spec:
      joinConfiguration:
        nodeRegistration:
          criSocket: unix:///var/run/containerd/containerd.sock
          kubeletExtraArgs:
          - name: eviction-hard
            value: nodefs.available<0%,nodefs.inodesFree<0%,imagefs.available<0%
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: in-memory
  namespace: app-cluster-api
spec:
  controlPlane:
    machineInfrastructure:
      templateRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: DevMachineTemplate
        name: in-memory-control-plane
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta2
      kind: KubeadmControlPlaneTemplate
      name: in-memory-control-plane
    healthCheck:
      checks:
        unhealthyNodeConditions:
        - type: Ready
          status: Unknown
          timeoutSeconds: 300
        - type: Ready
          status: 'False'
          timeoutSeconds: 300
        unhealthyMachineConditions:
        - type: NodeReady
          status: Unknown
          timeoutSeconds: 300
        - type: NodeReady
          status: 'False'
          timeoutSeconds: 300
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
      kind: DevClusterTemplate
      name: in-memory-cluster
  workers:
    machineDeployments:
    - class: default-worker
      bootstrap:
        templateRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
          kind: KubeadmConfigTemplate
          name: in-memory-default-worker-bootstraptemplate
      infrastructure:
        templateRef:
          apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
          kind: DevMachineTemplate
          name: in-memory-default-worker-machinetemplate
      healthCheck:
        checks:
          unhealthyNodeConditions:
          - type: Ready
            status: Unknown
            timeoutSeconds: 300
          - type: Ready
            status: 'False'
            timeoutSeconds: 300
          unhealthyMachineConditions:
          - type: NodeReady
            status: Unknown
            timeoutSeconds: 300
          - type: NodeReady
            status: 'False'
            timeoutSeconds: 300
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: demo
  namespace: app-cluster-api
spec:
  clusterNetwork:
    services:
      cidrBlocks:
      - 10.128.0.0/12
    pods:
      cidrBlocks:
      - 192.168.0.0/16
    serviceDomain: cluster.local
  topology:
    classRef:
      name: in-memory
      namespace: app-cluster-api
    version: v1.34.1
    controlPlane:
      replicas: 1
    workers:
      machineDeployments:
      - class: default-worker
        name: md-0
        replicas: 2

apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
# kubelet の cAdvisor から、Pod ごとの CPU とメモリを取る。nodes/proxy は kubelet 経由で exec できるので渡さない
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: showcase-prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/metrics"]
    verbs: ["get"]
  # API サーバが拒否した回数を数える
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: showcase-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: showcase-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: app-prometheus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: [localhost:9090]
      - job_name: cadvisor
        scheme: https
        metrics_path: /metrics/cadvisor
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        # kubelet の証明書は k3s が自分で署名している
        tls_config:
          insecure_skip_verify: true
        kubernetes_sd_configs:
          - role: node
        # 全部取るとメモリが足りないので、次だけを残す
        # - 来場者のアプリの CPU、メモリ、通信量、OOM、起動時刻
        # - ノード全体（id="/"）の CPU、メモリ、ディスクと、マシンの CPU 数とメモリ量
        metric_relabel_configs:
          - source_labels: [__name__, namespace, id, device]
            regex: >-
              container_(cpu_usage_seconds_total|memory_working_set_bytes|network_(receive|transmit)_bytes_total|oom_events_total|start_time_seconds);app-.+;.*;.*|container_(cpu_usage_seconds_total|memory_working_set_bytes);;/;.*|container_fs_(usage|limit)_bytes;;/;/dev/(vd|sd|nvme|loop).*|machine_(cpu_cores|memory_bytes);.*;.*;.*
            action: keep
      # ここから下は Grafana の「防いだ攻撃」に出す
      - job_name: apiserver
        scheme: https
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        static_configs:
          - targets: [kubernetes.default.svc:443]
        metric_relabel_configs:
          - source_labels: [__name__, name]
            regex: apiserver_validating_admission_policy_check_total;.*|apiserver_admission_controller_admission_duration_seconds_count;PodSecurity
            action: keep
      - job_name: tetragon
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_address_InternalIP]
            replacement: $1:2112
            target_label: __address__
        # 止めた user namespace と、来場者の Pod で起動したプロセス
        metric_relabel_configs:
          - source_labels: [__name__, policy, event_type, namespace]
            regex: tetragon_policy_events_total;kill-unprivileged-user-namespace;.*;.*|tetragon_events_total;;PROCESS_EXEC;app-.+
            action: keep
      - job_name: cilium
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_address_InternalIP]
            replacement: $1:9962
            target_label: __address__
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: cilium_drop_count_total
            action: keep
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      serviceAccountName: prometheus
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.16.0-distroless@sha256:e8b8fb0e336fe0affce6f9ea347b11d24975465fd3ba8119420186679c3efd5f
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            # ConfigMap を変えたら、Pod を作り直さずに読み直す
            - --config.auto-reload
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --storage.tsdb.retention.size=800MB
            # Grafana の匿名の閲覧者も任意の PromQL を流せる。重いクエリで止まらないようにする
            - --query.timeout=10s
            - --query.max-samples=5000000
            - --query.max-concurrency=4
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
          securityContext:
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus
        # Pod を作り直しても、キーノートなどのデータを残す
        - name: data
          persistentVolumeClaim:
            claimName: prometheus
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - port: 9090
      targetPort: 9090

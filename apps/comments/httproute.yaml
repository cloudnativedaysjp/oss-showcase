# https://comments.showcase.cloudnativedays.jp で公開する
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: comments
spec:
  parentRefs:
    - name: showcase
      namespace: gateway
  hostnames:
    - comments.showcase.cloudnativedays.jp
  rules:
    - backendRefs:
        - name: comments
          port: 80

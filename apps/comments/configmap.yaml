# コメントサーバのコード。comments/render.py が server.js・post.html・admin.html から作る（手では直さない）
apiVersion: v1
kind: ConfigMap
metadata:
  name: comments
data:
  server.js: |
    'use strict';
    // コメントサーバ。聴衆のスマホから投稿を受け取り、発表中のスライドに渡す。
    // 状態はメモリにだけ持つ。Pod が作り直されたら、コメントも停止の状態も消える。
    // 外部のパッケージは使わない（Node の標準ライブラリだけ）。
    const http = require('node:http');
    const fs = require('node:fs');
    const path = require('node:path');
    const crypto = require('node:crypto');

    const PORT = Number(process.env.PORT || 8080);
    // 管理用の合言葉の SHA-256（16進）。合言葉そのものはここにも YAML にも書かない。空なら管理の操作はできない
    const ADMIN_SHA256 = String(process.env.ADMIN_SHA256 || '').trim().toLowerCase();
    const MAX_LEN = 40;          // 1コメントの文字数
    const KEEP = 1000;           // 覚えておく件数（管理ページの一覧で見返せる分）
    const FRESH_MS = 15000;      // スライドに渡すのは、この時間より新しいものだけ（繋ぎ直したときに古いものを流さない）
    const MIN_GAP_MS = 1500;     // 同じ人が続けて送れる間隔
    const GLOBAL_PER_SEC = 5;    // 全体で1秒に受け付ける件数（スライドに流せる量に合わせる。超えた分は「混み合っています」と返す）
    const BODY_MAX = 2048;

    const page = name => fs.readFileSync(path.join(__dirname, name));
    const PAGES = { '/': page('post.html'), '/admin': page('admin.html') };

    let items = [];              // { id, t, at }
    let lastId = 0;
    let paused = false;          // 止めている間は投稿を受け付けず、スライドにも渡さない
    let epoch = Date.now();      // 変わったら、スライドは流れているコメントを全部消す
    const seen = new Map();      // 投稿者ごとの最後の投稿時刻
    let bucket = { sec: 0, n: 0 };
    let stats = { ok: 0, rejected: 0 };

    // 制御文字、改行、文字の向きを変える記号、見えない文字を取り除く（絵文字をつなぐ U+200D は残す）。
    // 文字の上下に記号を積み上げて縦に伸ばすいたずらは、積み上げを2つまでにして防ぐ
    const clean = s => String(s).normalize('NFC')
      .replace(/[\u0000-\u001f\u007f-\u009f\u200b\u200c\u200e\u200f\u2028-\u202e\u2060-\u206f\ufeff]/g, ' ')
      .replace(/(\p{M}{2})\p{M}+/gu, '$1')
      .replace(/\s+/g, ' ').trim();

    const send = (res, code, body, headers = {}) => {
      const buf = Buffer.isBuffer(body) ? body : Buffer.from(typeof body === 'string' ? body : JSON.stringify(body));
      res.writeHead(code, {
        'Content-Type': typeof body === 'string' || Buffer.isBuffer(body) ? 'text/plain; charset=utf-8' : 'application/json; charset=utf-8',
        'Content-Length': buf.length, 'Cache-Control': 'no-store', 'X-Content-Type-Options': 'nosniff', ...headers,
      });
      res.end(buf);
    };
    // スライドは別の場所（手元のファイルなど）から読みに来るので、読むだけの API は誰からでも読めるようにする
    const CORS = { 'Access-Control-Allow-Origin': '*' };

    const readJson = req => new Promise((resolve, reject) => {
      let size = 0; const chunks = [];
      // 大きすぎる本文は、覚えずに読み捨てる（接続は切らずに 400 を返す）
      req.on('data', c => { size += c.length; if (size <= BODY_MAX) chunks.push(c); });
      req.on('end', () => {
        if (size > BODY_MAX) return reject(new Error('too large'));
        try { const j = JSON.parse(Buffer.concat(chunks).toString('utf8')); if (!j || typeof j !== 'object' || Array.isArray(j)) throw new Error('not an object'); resolve(j); }
        catch (e) { reject(e); }
      });
      req.on('error', reject);
    });

    const isAdmin = req => {
      if (!/^[0-9a-f]{64}$/.test(ADMIN_SHA256)) return false;
      const m = /^Bearer\s+(.{8,200})$/.exec(req.headers.authorization || '');
      if (!m) return false;
      const got = crypto.createHash('sha256').update(m[1]).digest();
      return crypto.timingSafeEqual(got, Buffer.from(ADMIN_SHA256, 'hex'));
    };

    const state = () => ({ paused, epoch, last: lastId });

    async function handle(req, res) {
      let url;
      try { url = new URL(req.url, 'http://x'); } catch (e) { return send(res, 400, { error: 'bad_request' }); }
      const p = url.pathname;

      if (req.method === 'GET' && PAGES[p]) {
        return send(res, 200, PAGES[p], {
          'Content-Type': 'text/html; charset=utf-8', 'Referrer-Policy': 'no-referrer', 'X-Frame-Options': 'DENY',
          'Content-Security-Policy': "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; img-src data:; base-uri 'none'; form-action 'none'",
        });
      }
      if (req.method === 'GET' && p === '/healthz') return send(res, 200, 'ok');
      if (req.method === 'GET' && p === '/api/state') return send(res, 200, state(), CORS);

      // スライドが1秒おきに読みに来る。since より後のコメントだけを返す。since がなければ「今から」
      if (req.method === 'GET' && p === '/api/poll') {
        const since = Number(url.searchParams.get('since'));
        const now = Date.now();
        // 管理ページ用：覚えている分を、止めている間も、古いものも含めて返す（since より後だけ）。投稿の時刻も付ける
        if (url.searchParams.get('all') === '1' && isAdmin(req)) {
          const from = Number.isFinite(since) && since > 0 ? since : 0;
          return send(res, 200, { ...state(), items: items.filter(c => c.id > from).map(c => ({ id: c.id, t: c.t, at: c.at })) });
        }
        let out = [];
        if (!paused && url.searchParams.has('since') && Number.isFinite(since) && since >= 0) out = items.filter(c => c.id > since && now - c.at < FRESH_MS).slice(-30);
        return send(res, 200, { ...state(), items: out.map(c => ({ id: c.id, t: c.t })) }, CORS);
      }

      if (req.method === 'POST' && p === '/api/comments') {
        if (paused) return send(res, 503, { error: 'paused' });
        let body;
        try { body = await readJson(req); } catch (e) { return send(res, 400, { error: 'bad_request' }); }
        if (typeof body.t !== 'string') return send(res, 400, { error: 'bad_request' });
        const t = clean(body.t);
        const who = (typeof body.c === 'string' ? clean(body.c).slice(0, 64) : '') || 'anon';
        const len = [...t].length;
        if (!len) { stats.rejected++; return send(res, 400, { error: 'empty' }); }
        if (len > MAX_LEN) { stats.rejected++; return send(res, 400, { error: 'too_long', max: MAX_LEN }); }
        const now = Date.now();
        if (now - (seen.get(who) || 0) < MIN_GAP_MS) { stats.rejected++; return send(res, 429, { error: 'slow_down' }); }
        const sec = Math.floor(now / 1000);
        if (bucket.sec !== sec) bucket = { sec, n: 0 };
        if (bucket.n >= GLOBAL_PER_SEC) { stats.rejected++; return send(res, 429, { error: 'busy' }); }
        bucket.n++; seen.set(who, now);
        lastId = Math.max(lastId + 1, now);          // 時刻をもとにした番号。作り直されても番号が戻らない
        items.push({ id: lastId, t, at: now });
        if (items.length > KEEP) items = items.slice(-KEEP);
        stats.ok++;
        return send(res, 200, { ok: true });
      }

      // 一括で止める／再開する。止めるとスライドに流れているコメントも消える
      if (req.method === 'POST' && p === '/api/admin') {
        // 間違いが続いても締め出さない。締め出すと、外から間違いを送り続けるだけで、止める操作を妨害できてしまう。
        // 合言葉は十分に長いランダムな文字列なので、総当たりでは当たらない
        const now = Date.now();
        if (!isAdmin(req)) return send(res, 401, { error: 'unauthorized' });
        let body;
        try { body = await readJson(req); } catch (e) { return send(res, 400, { error: 'bad_request' }); }
        if (body.action === 'pause') { paused = true; epoch = now; }
        else if (body.action === 'resume') { paused = false; }
        else if (body.action === 'clear') { epoch = now; items = []; }
        else if (body.action !== 'check') return send(res, 400, { error: 'unknown_action' });
        console.log(`admin: ${body.action} -> paused=${paused}`);
        return send(res, 200, state());
      }

      if (req.method === 'OPTIONS') return send(res, 204, '', { ...CORS, 'Access-Control-Allow-Methods': 'GET', 'Access-Control-Max-Age': '600' });
      return send(res, 404, { error: 'not_found' });
    }

    const server = http.createServer((req, res) => {
      handle(req, res).catch(e => { console.error('error:', e && e.message); if (!res.headersSent) send(res, 500, { error: 'internal' }); });
    });
    server.requestTimeout = 10000; server.headersTimeout = 8000; server.keepAliveTimeout = 65000;

    setInterval(() => {
      const now = Date.now();
      for (const [k, v] of seen) if (now - v > 60000) seen.delete(k);
      if (stats.ok || stats.rejected) { console.log(`comments: accepted=${stats.ok} rejected=${stats.rejected} paused=${paused}`); stats = { ok: 0, rejected: 0 }; }
    }, 60000).unref();

    // 想定外のエラーで落ちると、止めている状態まで消える。記録だけして動き続ける
    process.on('uncaughtException', e => console.error('uncaught:', e && e.stack || e));
    process.on('unhandledRejection', e => console.error('unhandled:', e && e.stack || e));

    server.on('error', e => { console.error('listen failed:', e && e.message); process.exit(1); });   // 起動できないときは、作り直してもらう
    server.listen(PORT, () => console.log(`comments: listening on :${PORT} admin=${/^[0-9a-f]{64}$/.test(ADMIN_SHA256) ? 'on' : 'off'}`));
    for (const sig of ['SIGTERM', 'SIGINT']) process.on(sig, () => { server.close(() => process.exit(0)); setTimeout(() => process.exit(0), 3000).unref(); });
  post.html: |
    <!doctype html>
    <html lang="ja">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>コメントや質問はこちらから！</title>
    <style>
      :root { --ink: #0E1A3A; --ink-2: #4A5878; --paper: #F4F6FB; --line: #C9D2E8; --blue: #2F6CE5; --ng: #C6362E; }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body { min-height: 100dvh; background: var(--ink); color: #fff; font: 16px/1.6 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
        background-image: radial-gradient(circle, #1F2F5E 1.5px, transparent 2px); background-size: 28px 28px;
        padding: max(28px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); }
      main { max-width: 520px; margin: 0 auto; }
      h1 { margin: 0 0 6px; font-size: 30px; line-height: 1.3; letter-spacing: .01em; }
      .lead { margin: 0 0 26px; color: #B4C2E6; font-size: 15px; }
      form { display: flex; gap: 10px; }
      input { flex: 1; min-width: 0; height: 56px; padding: 0 16px; border: 2px solid transparent; border-radius: 14px; background: #fff; color: var(--ink); font: inherit; font-size: 18px; }
      input:focus-visible { outline: none; border-color: #8FB0FF; }
      button { font: inherit; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
      .go { height: 56px; padding: 0 22px; border-radius: 14px; background: var(--blue); color: #fff; font-weight: 700; font-size: 17px; white-space: nowrap; }
      .go:active, .quick button:active { transform: translateY(1px); }
      button:focus-visible { outline: 3px solid #8FB0FF; outline-offset: 2px; }
      button:disabled, input:disabled { opacity: .45; cursor: default; }
      .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; min-height: 30px; margin: 8px 2px 0; font-size: 14px; color: #B4C2E6; }
      #msg { font-weight: 600; color: #fff; }
      #msg.ng { color: #FFB1AA; }
      h2 { margin: 26px 0 10px; font-size: 14px; font-weight: 600; color: #B4C2E6; }
      .quick { display: flex; flex-wrap: wrap; gap: 10px; }
      .quick button { height: 48px; padding: 0 16px; border-radius: 12px; background: rgba(143, 176, 255, .16); color: #fff; font-size: 17px; font-weight: 600; border: 1.5px solid rgba(143, 176, 255, .45); }
      .note { margin: 34px 0 0; padding-top: 16px; border-top: 1px solid rgba(180, 194, 230, .3); color: #B4C2E6; font-size: 13px; }
      .note p { margin: 0 0 6px; }
    </style>
    </head>
    <body>
    <main>
      <h1>コメントや質問はこちらから！</h1>
      <p class="lead">送ったコメントが、キーノート「Kubernetes Schedulingの最前線から見る景色」のスライドの上を流れます。</p>

      <form id="f" autocomplete="off">
        <input id="t" type="text" maxlength="40" enterkeyhint="send" placeholder="コメントを書く" aria-label="コメント" autocapitalize="off">
        <button class="go" id="go" type="submit">送る</button>
      </form>
      <div class="row"><span id="msg" role="status" aria-live="polite"></span><span id="n">0 / 40</span></div>

      <h2>ひとことで送る</h2>
      <div class="quick" id="q"></div>

      <div class="note">
        <p>コメントは会場のスクリーンと配信に映ります。40文字まで送れます。</p>
        <p>このページは、WAIWAI広場の OSS Showcase の Kubernetes クラスタで動いています。</p>
      </div>
    </main>
    <script>
    (() => {
      const $ = id => document.getElementById(id);
      const QUICK = ['👏', '88888888', 'なるほど', 'わかりやすい', 'すごい', '草', '🎉'];
      const MSG = { paused: 'いまはコメントを受け付けていません', slow_down: '少し待ってから送ってください', busy: '混み合っています。少し待ってから送ってください',
        too_long: '40文字までにしてください', empty: 'コメントを書いてください' };
      let who = '';
      try { who = localStorage.getItem('who') || ''; if (!who) { who = crypto.randomUUID(); localStorage.setItem('who', who); } }
      catch (e) { who = String(Math.random()).slice(2) + Date.now(); }
      let paused = false, timer = null;

      const say = (text, ng) => { const m = $('msg'); m.textContent = text; m.className = ng ? 'ng' : ''; clearTimeout(timer); if (text && !ng) timer = setTimeout(() => { m.textContent = ''; }, 2500); };
      const lock = on => { paused = on; for (const e of document.querySelectorAll('input, button')) e.disabled = on; if (on) say(MSG.paused, true); else if ($('msg').textContent === MSG.paused) say(''); };

      async function post(text) {
        text = text.trim();
        if (!text) return say(MSG.empty, true);
        try {
          const r = await fetch('/api/comments', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: text, c: who }) });
          const j = await r.json().catch(() => ({}));
          if (r.ok) { say('送りました'); return true; }
          if (j.error === 'paused') lock(true); else say(MSG[j.error] || '送れませんでした。もう一度試してください', true);
        } catch (e) { say('送れませんでした。通信を確かめて、もう一度試してください', true); }
        return false;
      }

      $('f').addEventListener('submit', async e => { e.preventDefault(); const t = $('t'); if (await post(t.value)) { t.value = ''; $('n').textContent = '0 / 40'; } if (!paused) t.focus(); });
      $('t').addEventListener('input', e => { $('n').textContent = [...e.target.value].length + ' / 40'; });
      for (const q of QUICK) { const b = document.createElement('button'); b.type = 'button'; b.textContent = q; b.addEventListener('click', () => post(q)); $('q').appendChild(b); }

      // 止められているあいだは、入力欄を使えなくする
      async function watch() {
        try { const j = await (await fetch('/api/state', { cache: 'no-store' })).json(); if (!!j.paused !== paused) lock(!!j.paused); } catch (e) {}
        setTimeout(watch, 5000);
      }
      watch();
    })();
    </script>
    </body>
    </html>
  admin.html: |
    <!doctype html>
    <html lang="ja">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>コメントの管理</title>
    <style>
      :root { --ink: #0E1A3A; --ink-2: #4A5878; --paper: #F4F6FB; --line: #C9D2E8; --blue: #2F6CE5; --ng: #C6362E; --ok: #17805A; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 28px 20px; background: var(--paper); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
      main { max-width: 560px; margin: 0 auto; }
      h1 { margin: 0 0 18px; font-size: 26px; }
      #st { padding: 14px 16px; border-radius: 12px; font-size: 20px; font-weight: 700; background: #fff; border: 2px solid var(--line); }
      #st.on { border-color: var(--ok); color: var(--ok); } #st.off { border-color: var(--ng); color: var(--ng); }
      .btns { display: grid; gap: 12px; margin: 16px 0 8px; }
      button { height: 64px; border: 0; border-radius: 14px; font: inherit; font-size: 20px; font-weight: 700; color: #fff; cursor: pointer; }
      button:focus-visible { outline: 3px solid #8FB0FF; outline-offset: 2px; }
      button:disabled { opacity: .4; cursor: default; }
      #stop { background: var(--ng); } #go { background: var(--ok); }
      #msg { min-height: 26px; color: var(--ng); font-weight: 600; }
      h2 { margin: 26px 0 8px; font-size: 15px; color: var(--ink-2); }
      ol { margin: 0; padding: 0; list-style: none; background: #fff; border: 1px solid var(--line); border-radius: 12px; min-height: 52px; }
      li { padding: 9px 14px; border-top: 1px solid #E6EAF4; overflow-wrap: anywhere; } li:first-child { border-top: 0; }
      li.none { color: var(--ink-2); }
      li { display: flex; gap: 12px; } li time { flex: none; color: var(--ink-2); font-variant-numeric: tabular-nums; }
      li.q span { font-weight: 700; color: #8A5300; }
      .tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 8px; }
      .tools label { display: flex; align-items: center; gap: 8px; margin: 0; font-weight: 500; }
      .tools input { width: 20px; height: 20px; }
      #copy { height: 40px; padding: 0 16px; font-size: 15px; background: var(--blue); }
      label { display: block; margin: 0 0 6px; font-weight: 600; }
      input { width: 100%; height: 52px; padding: 0 14px; border: 2px solid var(--line); border-radius: 12px; font: inherit; }
      #login button { margin-top: 12px; width: 100%; background: var(--blue); }
      .hint { margin: 10px 0 0; color: var(--ink-2); font-size: 14px; }
    </style>
    </head>
    <body>
    <main>
      <h1>コメントの管理</h1>
      <form id="login" hidden>
        <label for="tk">管理用の合言葉</label>
        <input id="tk" type="password" autocomplete="off">
        <button type="submit">入る</button>
      </form>
      <div id="panel" hidden>
        <div id="st">確認中…</div>
        <div class="btns">
          <button id="stop" type="button">コメントを止めて、画面から消す</button>
          <button id="go" type="button">再開する</button>
        </div>
        <p class="hint">止めると、流れているコメントがスライドから消え、新しい投稿も受け付けなくなります。</p>
        <h2 id="lh">コメント（新しい順）</h2>
        <div class="tools">
          <label><input type="checkbox" id="q"> 「？」を含むものだけ</label>
          <button id="copy" type="button">コピー</button>
        </div>
        <ol id="list"><li class="none">まだありません</li></ol>
        <p class="hint">サーバが覚えているのは、直近の1000件までです。サーバが作り直されると、それより前の分はこのページを開いたままの画面にだけ残ります。</p>
      </div>
      <p id="msg" role="alert"></p>
    </main>
    <script>
    (() => {
      const $ = id => document.getElementById(id);
      // 合言葉は URL の # の後ろで受け取る（# の後ろはサーバに送られない）。受け取ったら URL から消す
      let token = '';
      try { token = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
      try { if (token) { sessionStorage.setItem('tk', token); history.replaceState(null, '', location.pathname); } else token = sessionStorage.getItem('tk') || ''; } catch (e) {}
      const auth = () => ({ Authorization: 'Bearer ' + token });

      const show = j => {
        $('st').textContent = j.paused ? '止めています' : 'コメントが流れています';
        $('st').className = j.paused ? 'off' : 'on';
        $('stop').disabled = !!j.paused; $('go').disabled = !j.paused;
      };
      async function act(action) {
        $('msg').style.color = ''; $('msg').textContent = '';
        try {
          const r = await fetch('/api/admin', { method: 'POST', headers: { 'Content-Type': 'application/json', ...auth() }, body: JSON.stringify({ action }) });
          if (r.status === 401) { fail('合言葉が違います'); return false; }
          if (!r.ok) throw new Error(r.status);
          show(await r.json()); return true;
        } catch (e) { $('msg').textContent = '通信できませんでした。もう一度押してください'; return false; }
      }
      function fail(text) { try { sessionStorage.removeItem('tk'); } catch (e) {} token = ''; $('panel').hidden = true; $('login').hidden = false; $('msg').textContent = text; }

      // 一覧は、前に受け取った分の続きだけを取りに行く。サーバが作り直されても、この画面に出ている分は残す
      let log = [], last = 0;
      const isQ = t => /[?？]/.test(t);
      const hms = at => { const d = new Date(at), p = n => String(n).padStart(2, '0'); return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()); };
      const shown = () => $('q').checked ? log.filter(c => isQ(c.t)) : log;
      function draw() {
        const ol = $('list'), a = shown().slice(-300).reverse();
        $('lh').textContent = 'コメント ' + log.length + '件（新しい順）';
        ol.textContent = '';
        if (!a.length) { const li = document.createElement('li'); li.className = 'none'; li.textContent = 'まだありません'; ol.appendChild(li); }
        for (const c of a) {
          const li = document.createElement('li'), tm = document.createElement('time'), sp = document.createElement('span');
          if (isQ(c.t)) li.className = 'q';
          tm.textContent = hms(c.at); sp.textContent = c.t; li.appendChild(tm); li.appendChild(sp); ol.appendChild(li);
        }
      }
      async function list() {
        if (token && !$('panel').hidden) {
          try {
            const j = await (await fetch('/api/poll?all=1&since=' + last, { cache: 'no-store', headers: auth() })).json();
            show(j);
            if (j.last < last) last = 0;   // サーバが作り直された。次から取り直す
            const top = log.length ? log[log.length - 1].id : 0;
            const add = (j.items || []).filter(c => c && typeof c.t === 'string' && c.id > top);
            if (add.length) { log = log.concat(add); draw(); }
            if (j.last > last) last = j.last;
          } catch (e) {}
        }
        setTimeout(list, 2000);
      }
      $('q').addEventListener('change', draw);
      $('copy').addEventListener('click', async () => {
        const a = shown(), text = '時刻\tコメント\n' + a.map(c => hms(c.at) + '\t' + c.t).join('\n') + '\n';
        try { await navigator.clipboard.writeText(text); $('msg').style.color = 'var(--ok)'; $('msg').textContent = a.length + '件をコピーしました'; }
        catch (e) { $('msg').style.color = ''; $('msg').textContent = 'コピーできませんでした'; }
      });
      async function enter() { if (await act('check')) { $('login').hidden = true; $('panel').hidden = false; } }

      $('stop').addEventListener('click', () => act('pause'));
      $('go').addEventListener('click', () => act('resume'));
      $('login').addEventListener('submit', e => { e.preventDefault(); token = $('tk').value.trim(); try { sessionStorage.setItem('tk', token); } catch (e2) {} enter(); });
      if (token) enter(); else $('login').hidden = false;
      list();
    })();
    </script>
    </body>
    </html>

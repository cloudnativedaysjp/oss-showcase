    <section id="s-agent">
      <div class="sec-head"><span class="hex"></span><h2>ルールが多い分、覚えるのはエージェントに任せる</h2></div>
      <p class="lede">守りを固めた分、この展示には固有のルールがたくさんあります。<br>人が全部覚えて YAML を書くのは大変なので、ルールをエージェントが読める形で書きました。</p>
      <div class="agent-split">
        <div class="stop"><b>人が書くと、覚えることが多い</b>
          <ul class="plain">
            <li>ホスト名は <code>&lt;名前&gt;.showcase.cloudnativedays.jp</code> だけ</li>
            <li>イメージは、決まったレジストリからだけ</li>
            <li>volume は、決まった 8 種類だけ</li>
            <li>外への通信は、DNS、80 番、443 番だけ</li>
            <li>Ingress、NodePort、priorityClassName は使えない</li>
            <li>CPU、メモリ、Pod の数に上限がある</li>
          </ul>
        </div>
        <div class="pass"><b>エージェントには、任せられるようにした</b>
          <ul class="plain">
            <li>手順は <code>AGENTS.md</code> に 1 つだけ</li>
            <li>CI のエラーは、直し方まで書く。エージェントはログを読んで自分で直す</li>
            <li><code>apps/example/</code> をコピーして 3 か所変えれば動く</li>
          </ul>
        </div>
      </div>
      <div class="agent-proof">
        <p>README と AGENTS.md だけを渡したエージェントが、Mailpit を選んで CI を通る PR を出した。</p>
        <p>エージェントが書いた PR も、クラスタでは人の PR と同じように縛る。</p>
      </div>
    </section>

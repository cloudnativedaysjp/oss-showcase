# 話すときに使う、展示の守り方の解説ページ。index.html と nginx.conf から kubectl create configmap --dry-run=client -o yaml で作る
apiVersion: v1
data:
  index.html: |
    <!doctype html>
    <html lang="ja">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>OSS Showcase の守り方</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
    <style>
    /* 縦に 1 本のスクロール。中心は「攻撃 → 4 つの層」のシミュレータ。CND のポータルと同じ紺、マゼンタ、オレンジを使う */
    :root {
      --bg: #f3f7fb;
      --surface: #ffffff;
      --sunk: #e7eef5;
      --ink: #1e2d3d;
      --muted: #4c5b6c;
      --line: #cfdae5;
      --blue: #216a9c;
      --magenta: #be4493;
      --magenta-soft: #f6e3ef;
      --orange: #c97a0a;
      --orange-soft: #fbefd9;
      --code-bg: #14212f;
      --code-ink: #dbe7f2;
      --code-dim: #8ea3b8;
      --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
      --font-code: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
      --step-0: clamp(1rem, 0.95rem + 0.3vw, 1.15rem);
      --step-1: clamp(1.2rem, 1.1rem + 0.5vw, 1.45rem);
      --step-2: clamp(1.5rem, 1.3rem + 1vw, 2.1rem);
      --step-3: clamp(2rem, 1.5rem + 2.4vw, 3.6rem);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0e1924; --surface: #152331; --sunk: #1b2c3d; --ink: #e5eef7; --muted: #a2b3c4; --line: #2b3f53;
        --blue: #6cb2e3; --magenta: #e584c2; --magenta-soft: #3a2232; --orange: #f2a940; --orange-soft: #3a2c16;
        --code-bg: #0a131c; --code-ink: #dbe7f2; --code-dim: #7f95ab;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0e1924; --surface: #152331; --sunk: #1b2c3d; --ink: #e5eef7; --muted: #a2b3c4; --line: #2b3f53;
      --blue: #6cb2e3; --magenta: #e584c2; --magenta-soft: #3a2232; --orange: #f2a940; --orange-soft: #3a2c16;
      --code-bg: #0a131c; --code-ink: #dbe7f2; --code-dim: #7f95ab;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
    body { margin: 0; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: var(--font-body); font-weight: 500; font-size: var(--step-0); line-height: 1.75;
      word-break: auto-phrase; line-break: strict; text-wrap: pretty;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }
    .wrap { max-width: 1280px; margin: 0 auto; }
    h1, h2, h3 { font-weight: 900; line-height: 1.3; text-wrap: balance; word-break: auto-phrase; margin: 0; }
    h2 { font-size: var(--step-2); }
    h3 { font-size: var(--step-1); font-weight: 700; }
    p { margin: 0; }
    a { color: var(--blue); text-underline-offset: 3px; }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--magenta); outline-offset: 3px; border-radius: 4px; }
    code { font-family: var(--font-code); font-size: 0.88em; background: var(--sunk); padding: 0.05em 0.35em; border-radius: 4px; }

    /* 見出しの横に、六角形をひとつ置く。ポータルのタイルと同じ形 */
    .hex { display: inline-block; width: 0.9em; aspect-ratio: 1 / 1.1547; background: var(--magenta);
      clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); flex: none; }
    .sec-head { display: flex; align-items: center; gap: 0.6em; }
    .sec-head .hex { width: 0.7em; }

    section { padding-block: clamp(48px, 7vw, 96px); border-top: 1px solid var(--line); }
    .lede { color: var(--muted); max-width: 58em; margin-top: 0.8em; }

    /* ---------- ヒーロー ---------- */
    .hero { padding-block: clamp(32px, 5vw, 72px) clamp(24px, 3vw, 40px); }
    .hero .kicker { color: var(--blue); font-weight: 700; display: flex; align-items: center; gap: 0.5em; }
    .hero h1 { font-size: var(--step-3); margin-top: 0.5em; max-width: 22em; }
    .hero h1 .yaml { font-family: var(--font-code); font-weight: 700; color: var(--magenta); }
    .hero .lede { font-size: var(--step-1); margin-top: 1em; }
    .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 2em; font-weight: 700; }
    .flow span { padding: 0.35em 0.8em; border: 2px solid var(--line); border-radius: 999px; background: var(--surface); }
    .flow span.end { border-color: var(--magenta); color: var(--magenta); }
    .flow i { font-style: normal; color: var(--muted); }

    /* ---------- 前提：守るもの ---------- */
    .goals { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 2em; }
    .goal { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; display: grid; gap: 6px; }
    .goal b { font-size: var(--step-1); }
    .goal p { color: var(--muted); }
    .allowed { margin-top: 2.4em; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .allowed > div { min-width: 0; }
    .allowed h3 { margin-bottom: 0.5em; }
    .allowed ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
    @media (max-width: 720px) { .allowed { grid-template-columns: 1fr; } }

    /* ---------- 構成 ---------- */
    .arch { margin-top: 2em; display: grid; grid-template-columns: 1fr auto 1.3fr; gap: 18px; align-items: stretch; }
    .arch .col { display: grid; gap: 14px; align-content: start; min-width: 0; }
    .box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-width: 0; }
    .box.visitor { border-top: 4px solid var(--blue); }
    .box.staff { border-top: 4px solid var(--magenta); }
    .box .tag { font-size: 0.82em; font-weight: 700; color: var(--muted); }
    .box h3 { margin-top: 2px; }
    .box p, .box li { color: var(--muted); }
    .box ul { margin: 6px 0 0; padding-left: 1.2em; }
    .arrow { align-self: center; font-size: 2em; color: var(--muted); font-weight: 900; }
    .cluster { background: var(--sunk); border-radius: 16px; padding: 18px; display: grid; gap: 12px; }
    .cluster .row { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-weight: 700; font-size: 0.92em; }
    .chip small { display: block; font-weight: 500; color: var(--muted); }
    @media (max-width: 860px) { .arch { grid-template-columns: 1fr; } .arrow { transform: rotate(90deg); justify-self: center; } }

    /* ---------- 4 つの層 ---------- */
    .layers { margin-top: 2em; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; counter-reset: layer; }
    .layer { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 8px; align-content: start; min-width: 0; }
    .layer .num { font-family: var(--font-code); font-weight: 700; color: var(--magenta); }
    .layer p { color: var(--muted); }
    .layer ul { margin: 0; padding-left: 1.1em; font-size: 0.94em; display: grid; gap: 2px; }
    .layer .role { font-weight: 700; color: var(--ink); }
    @media (max-width: 900px) { .layers { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 520px) { .layers { grid-template-columns: 1fr; } }

    /* ---------- シミュレータ ---------- */
    .sim { margin-top: 2em; display: grid; grid-template-columns: minmax(250px, 340px) minmax(0, 1fr); gap: 20px; align-items: start; }
    .picker { display: grid; gap: 14px; min-width: 0; }
    .picker h3 { font-size: 0.95em; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
    .picker .group { display: grid; gap: 6px; }
    .attack-btn {
      font: inherit; font-weight: 700; text-align: left; color: var(--ink); cursor: pointer;
      background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px;
      display: flex; align-items: center; gap: 10px;
    }
    .attack-btn:hover { border-color: var(--blue); }
    .attack-btn[aria-pressed="true"] { border-color: var(--magenta); background: var(--magenta-soft); }
    .attack-btn .hex { width: 0.7em; background: var(--line); }
    .attack-btn[aria-pressed="true"] .hex { background: var(--magenta); }

    .stage { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: clamp(16px, 2.5vw, 28px); display: grid; gap: 22px; min-width: 0; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
    .stage .what { display: grid; gap: 6px; }
    .stage .what .label { color: var(--muted); font-weight: 700; font-size: 0.9em; }
    .stage h3 { font-size: var(--step-2); font-weight: 900; }
    .track { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .lane { border-radius: 10px; padding: 12px 10px 14px; background: var(--sunk); display: grid; gap: 6px; justify-items: center; text-align: center; min-width: 0; transition: background .25s; }
    .lane .lname { font-weight: 700; font-size: 0.86em; color: var(--muted); }
    .lane .state { font-weight: 900; font-size: var(--step-1); color: var(--muted); }
    .lane[data-s="stop"] { background: var(--magenta-soft); }
    .lane[data-s="stop"] .state { color: var(--magenta); }
    .lane[data-s="log"] { background: var(--orange-soft); }
    .lane[data-s="log"] .state { color: var(--orange); }
    .lane[data-s="pass"] .state { color: var(--muted); opacity: .6; }
    .token { position: absolute; top: -10px; left: 0; width: 20px; aspect-ratio: 1/1.1547; background: var(--blue);
      clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); transition: left .7s cubic-bezier(.3,.7,.2,1); }
    .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.86em; color: var(--muted); }
    .legend span::before { content: ""; display: inline-block; width: 0.8em; height: 0.8em; border-radius: 3px; margin-right: 0.35em; vertical-align: -0.05em; background: var(--sunk); }
    .legend .s::before { background: var(--magenta); }
    .legend .l::before { background: var(--orange); }
    .how { display: grid; gap: 10px; }
    .how ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
    .how .why { color: var(--muted); }
    pre {
      margin: 0; background: var(--code-bg); color: var(--code-ink); border-radius: 10px; padding: 14px 16px;
      font-family: var(--font-code); font-size: 0.82em; line-height: 1.6; overflow-x: auto; white-space: pre;
    }
    pre .c { color: var(--code-dim); }
    pre code { background: none; padding: 0; font-size: 1em; color: inherit; }
    .src { font-size: 0.82em; color: var(--muted); font-family: var(--font-code); }
    .stage > * { min-width: 0; }
    @media (max-width: 900px) { .sim { grid-template-columns: minmax(0, 1fr); } .stage { position: static; } }
    @media (max-width: 520px) { .track { grid-template-columns: 1fr 1fr; } .token { display: none; } }

    /* ---------- 原則 ---------- */
    .principles { margin-top: 2em; display: grid; gap: 0; }
    .principle { display: grid; grid-template-columns: minmax(200px, 0.9fr) 1.6fr; gap: 24px; padding-block: 22px; border-bottom: 1px solid var(--line); }
    .principle:first-child { border-top: 1px solid var(--line); }
    .principle h3 { color: var(--ink); }
    .principle p { color: var(--muted); }
    .principle .ex { margin-top: 6px; font-size: 0.92em; }
    @media (max-width: 720px) { .principle { grid-template-columns: 1fr; gap: 6px; } }

    /* ---------- 見つけた穴 ---------- */
    .holes { margin-top: 2em; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
    .hole { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 12px; align-content: start; min-width: 0; }
    .hole .who { font-size: 0.85em; font-weight: 700; color: var(--blue); }
    .hole dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; }
    .hole dt { font-weight: 700; color: var(--magenta); white-space: nowrap; }
    .hole dd { margin: 0; color: var(--muted); min-width: 0; }

    /* ---------- 数字 ---------- */
    .limits { margin-top: 2em; overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; min-width: 520px; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 0.88em; color: var(--muted); font-weight: 700; }
    td.n { font-family: var(--font-code); font-weight: 700; white-space: nowrap; }

    /* ---------- 課題 ---------- */
    .todo { margin-top: 2em; display: grid; gap: 14px; }
    .todo .item { display: grid; grid-template-columns: 9em 1fr; gap: 16px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
    .todo .item b { color: var(--orange); }
    .todo .item p { color: var(--muted); }
    @media (max-width: 600px) { .todo .item { grid-template-columns: 1fr; gap: 4px; } }

    footer { padding-block: 48px 64px; border-top: 1px solid var(--line); display: grid; gap: 16px; }
    footer .links { display: flex; flex-wrap: wrap; gap: 10px 24px; font-weight: 700; }
    footer p { color: var(--muted); font-size: 0.9em; }

    /* 見つけた穴：一言、通り道、なぜと対策 */
    .breaches { margin-top: 2em; display: grid; gap: 18px; }
    .breach { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: clamp(18px, 2.4vw, 28px); display: grid; gap: 16px; min-width: 0; }
    .breach .tag { font-size: 0.85em; font-weight: 700; color: var(--blue); }
    .breach h3 { font-size: var(--step-1); font-weight: 900; }
    .route { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .route .hop { background: var(--sunk); border-radius: 8px; padding: 6px 12px; font-weight: 700; font-size: 0.92em; }
    .route .hop small { display: block; font-weight: 500; color: var(--muted); font-size: 0.85em; }
    .route .hop.bad { background: var(--magenta-soft); color: var(--magenta); outline: 2px solid var(--magenta); }
    .route .hop.bad small { color: var(--magenta); }
    .route .hop.goal { background: var(--ink); color: var(--bg); }
    .route .hop.goal small { color: var(--bg); opacity: .75; }
    .route i { font-style: normal; font-weight: 900; color: var(--muted); }
    .fix { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; }
    .fix div { display: grid; gap: 2px; min-width: 0; align-content: start; }
    .fix b { font-size: 0.85em; }
    .fix .why b { color: var(--magenta); }
    .fix .how b { color: var(--blue); }
    .fix p { color: var(--muted); }
    .breach .note { font-size: 0.9em; color: var(--muted); background: var(--sunk); border-radius: 8px; padding: 8px 12px; }
    .breach .note b { color: var(--ink); }
    @media (max-width: 720px) { .fix { grid-template-columns: 1fr; } }

    /* YAML で見える世界と、見えない世界 */
    .worlds { margin-top: 2em; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .world { border-radius: 14px; padding: clamp(18px, 2.4vw, 28px); display: grid; gap: 12px; align-content: start; min-width: 0; }
    .world.k8s { background: var(--surface); border: 1px solid var(--line); }
    .world.app { background: var(--code-bg); color: var(--code-ink); }
    .world .tag { font-size: 0.85em; font-weight: 700; }
    .world.k8s .tag { color: var(--blue); }
    .world.app .tag { color: var(--orange); }
    .world h3 { font-weight: 900; }
    .world ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
    .world.k8s li { color: var(--muted); }
    .world.app li { color: var(--code-ink); opacity: .9; }
    .world .verdict { font-weight: 700; }
    .world.k8s .verdict { color: var(--blue); }
    .world.app .verdict { color: var(--orange); }
    .world pre { background: var(--sunk); color: var(--ink); }
    .world.app pre { background: rgba(255,255,255,.06); color: var(--code-ink); }
    .world.app code { background: rgba(255,255,255,.14); color: var(--code-ink); }
    .world pre code { background: none; padding: 0; font-size: 1em; color: inherit; }
    @media (max-width: 760px) { .worlds { grid-template-columns: 1fr; } }
    .runtime { margin-top: 18px; overflow-x: auto; }
    .runtime table { min-width: 560px; }
    .runtime td:first-child { font-weight: 700; white-space: nowrap; }
    .runtime td.mech { font-weight: 700; color: var(--magenta); white-space: nowrap; }

    /* エージェントが PR を書く前提のリポジトリ */
    .agent-split { margin-top: 2em; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .agent-split > div { border-radius: 14px; padding: 20px 22px; display: grid; gap: 6px; align-content: start; min-width: 0; }
    .agent-split .pass { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--blue); }
    .agent-split .stop { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--magenta); }
    .agent-split b { font-size: var(--step-1); }
    .agent-split p { color: var(--muted); }
    @media (max-width: 720px) { .agent-split { grid-template-columns: 1fr; } }
    .agent-items { margin-top: 18px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    @media (max-width: 720px) { .agent-items { grid-template-columns: minmax(0, 1fr); } }
    .agent-item pre { white-space: pre-wrap; }
    .agent-item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: grid; gap: 8px; align-content: start; min-width: 0; }
    .agent-item h3 { font-size: 1.05em; }
    .agent-item p { color: var(--muted); }
    .agent-proof { margin-top: 18px; background: var(--sunk); border-radius: 12px; padding: 16px 20px; display: grid; gap: 4px; }
    .agent-proof b { color: var(--ink); }
    .agent-proof p { color: var(--muted); }

    /* タブ。話す順に切り替える */
    .tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; gap: 4px; overflow-x: auto; padding-block: 8px; }
    body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
    .tab { font: inherit; font-weight: 700; color: var(--muted); background: none; border: 0; border-radius: 999px; padding: 8px 16px; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
    .tab .n { font-family: var(--font-code); font-size: 0.85em; color: var(--magenta); }
    .tab:hover { color: var(--ink); background: var(--sunk); }
    .tab[aria-selected="true"] { color: var(--surface); background: var(--ink); }
    .tab[aria-selected="true"] .n { color: var(--surface); opacity: .8; }
    .panel > section:first-child { border-top: 0; padding-top: clamp(24px, 3vw, 40px); }
    .pager { display: flex; justify-content: space-between; gap: 12px; padding-block: 8px 48px; }
    .pager button { font: inherit; font-weight: 700; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 10px 20px; cursor: pointer; }
    .pager button:hover { border-color: var(--magenta); color: var(--magenta); }
    .pager .next { margin-left: auto; }
    .principle { padding-block: 14px !important; }
    .agent-split ul.plain { margin: 4px 0 0; padding-left: 1.2em; display: grid; gap: 4px; color: var(--muted); }

    /* デザインの見直し：カードを減らし、六角形を印に使う */
    #s-premise .goals { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 40px; }
    #s-premise .goal { background: none; border: 0; border-radius: 0; padding: 0 0 0 1.6em; position: relative; }
    #s-premise .goal::before { content: ""; position: absolute; left: 0; top: 0.45em; width: 0.9em; aspect-ratio: 1 / 1.1547; background: var(--magenta);
      clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
    @media (max-width: 640px) { #s-premise .goals { grid-template-columns: minmax(0, 1fr); } }
    .layers { gap: 0 24px; }
    .layer { background: none; border: 0; border-radius: 0; border-top: 3px solid var(--line); padding: 26px 0 0; position: relative; }
    .layer::before { content: ""; position: absolute; top: -12px; left: 0; width: 20px; aspect-ratio: 1 / 1.1547; background: var(--magenta);
      clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
    .layer .num { font-family: var(--font-body); font-weight: 900; font-size: var(--step-1); color: var(--ink); }
    @media (max-width: 900px) { .layers { gap: 32px 24px; } }

    /* ヒーローの主役：悪い PR の YAML。問題の行に、止める層の番号を付ける */
    .hero-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: clamp(24px, 4vw, 56px); align-items: start; margin-top: 1.2em; }
    .hero-body .lede { margin-top: 0; }
    .hero-body .flow { margin-top: 1.6em; flex-direction: column; align-items: flex-start; gap: 4px; }
    .hero-body .flow i { padding-left: 1.2em; line-height: 1; }
    .hero h1 .yaml { color: inherit; }
    .pr { margin: 0; background: var(--code-bg); color: var(--code-ink); border-radius: 14px; overflow: hidden; min-width: 0; }
    .pr-head { display: flex; justify-content: space-between; gap: 12px; padding: 10px 16px; font-family: var(--font-code); font-size: 0.8em; color: var(--code-dim); border-bottom: 1px solid rgba(255,255,255,.08); }
    .pr-head b { color: var(--code-ink); font-weight: 700; }
    .pr-lines { margin: 0; padding: 8px 0 10px; list-style: none; font-family: var(--font-code); font-size: clamp(0.72rem, 0.62rem + 0.3vw, 0.88rem); line-height: 1.6; overflow-x: auto; }
    .pr-lines li { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 0 14px 0 16px; border-left: 3px solid transparent; white-space: pre; }
    .pr-lines li.bad { background: rgba(229, 132, 194, .12); border-left-color: var(--magenta); }
    .pr-lines code { background: none; padding: 0; font-size: 1em; color: inherit; }
    .pr-lines li { min-height: 1.95em; }
    .pr-foot .legend-item { white-space: nowrap; margin-right: 0.8em; }
    .stops { display: flex; gap: 4px; }
    .stops span { font-family: var(--font-body); font-weight: 700; font-size: 0.86em; line-height: 1; padding: 5px 10px; border-radius: 999px; color: #fff; background: var(--magenta); white-space: nowrap; }
    .pr-foot { padding: 10px 16px 14px; font-size: 0.85em; color: var(--code-dim); border-top: 1px solid rgba(255,255,255,.08); }
    @media (max-width: 960px) { .hero-body { grid-template-columns: minmax(0, 1fr); } }

    /* 2 枚目以降のタブでは、見出しだけを小さく残す */
    .hero.compact { padding-block: 24px 8px; }
    .hero.compact h1 { font-size: var(--step-2); margin-top: 0.3em; max-width: none; }
    .hero.compact h1 br { display: none; }
    .hero.compact .hero-body { display: none; }

    /* 入れなかったもの */
    .skipped { margin-top: 24px; display: grid; grid-template-columns: minmax(180px, 0.6fr) minmax(0, 2fr); gap: 8px 32px; padding: 20px 22px; border: 1px dashed var(--line); border-radius: 12px; }
    .skipped .k { font-weight: 900; }
    .skipped .k small { display: block; font-weight: 700; color: var(--muted); font-size: 0.82em; }
    .skipped p { color: var(--muted); }
    @media (max-width: 720px) { .skipped { grid-template-columns: minmax(0, 1fr); } }

    /* youki と runc の違い */
    .diffs { margin-top: 2em; display: grid; gap: 18px; }
    .diff { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: clamp(18px, 2.4vw, 26px); display: grid; gap: 12px; min-width: 0; }
    .diff h3 { font-size: var(--step-1); font-weight: 900; }
    .diff .cmp { overflow-x: auto; }
    .diff table { min-width: 480px; }
    .diff td.rt { font-family: var(--font-code); font-weight: 700; white-space: nowrap; }
    .diff tr.ng td { color: var(--magenta); font-weight: 700; }
    .diff .what { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; }
    .diff .what div { display: grid; gap: 2px; align-content: start; min-width: 0; }
    .diff .what b { font-size: 0.85em; color: var(--blue); }
    .diff .what p { color: var(--muted); }
    @media (max-width: 720px) { .diff .what { grid-template-columns: 1fr; } }

    @media (prefers-reduced-motion: reduce) { .token, .lane { transition: none; } }
    </style>
    </head>
    <body>


    <div class="wrap">

    <header class="hero">
      <p class="kicker"><span class="hex"></span>CloudNative Days WAIWAI広場 ／ OSS Showcase の裏側</p>
      <h1>知らない人の <span class="yaml">YAML</span> が、<br>マージ 1 回で本番に入ってくる。</h1>
      <div class="hero-body">
        <div>
      <p class="lede">OSS Showcase は、PR を 1 本出すだけで、会場の Kubernetes にアプリを載せられる展示です。<br>誰でも PR を出せるクラスタを、どう考えて守ったかを紹介します。</p>
        <div class="flow" aria-label="来場者のアプリが公開されるまで">
        <span>fork して YAML を書く</span><i>↓</i><span>PR</span><i>↓</i><span>CI</span><i>↓</i><span>マージ</span><i>↓</i><span>Argo CD が同期</span><i>↓</i><span class="end">https://&lt;名前&gt;.showcase.cloudnativedays.jp</span>
      </div>
        </div>
        <figure class="pr" aria-label="来場者から届いたかもしれない YAML">
          <div class="pr-head"><b>apps/myapp/app.yaml</b><span>Pull Request</span></div>
          <ol class="pr-lines"><li><code>apiVersion: apps/v1</code><span class="stops"None></span></li><li><code>kind: Deployment</code><span class="stops"None></span></li><li><code>metadata:</code><span class="stops"None></span></li><li><code>  name: myapp</code><span class="stops"None></span></li><li class="bad"><code>  namespace: kube-system</code><span class="stops"><span>CI</span><span>Argo CD</span><span>API サーバ</span></span></li><li><code>spec:</code><span class="stops"None></span></li><li><code>  template:</code><span class="stops"None></span></li><li><code>    spec:</code><span class="stops"None></span></li><li class="bad"><code>      priorityClassName: system-node-critical</code><span class="stops"><span>CI</span><span>API サーバ</span></span></li><li><code>      containers:</code><span class="stops"None></span></li><li><code>        - name: app</code><span class="stops"None></span></li><li class="bad"><code>          image: 10.0.0.1.nip.io/miner</code><span class="stops"><span>CI</span><span>API サーバ</span><span>実行時</span></span></li><li><code>          securityContext:</code><span class="stops"None></span></li><li class="bad"><code>            privileged: true</code><span class="stops"><span>API サーバ</span></span></li><li><code>      volumes:</code><span class="stops"None></span></li><li><code>        - name: root</code><span class="stops"None></span></li><li class="bad"><code>          hostPath: { path: / }</code><span class="stops"><span>CI</span><span>API サーバ</span></span></li></ol>
          <figcaption class="pr-foot">印の付いた行は、右に書いた層で止まる。</figcaption>
        </figure>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="話の順番"><button class="tab" role="tab" id="tab-premise" aria-controls="p-premise" data-k="premise"><span class="n">1</span>前提</button><button class="tab" role="tab" id="tab-layers" aria-controls="p-layers" data-k="layers"><span class="n">2</span>守りの層</button><button class="tab" role="tab" id="tab-attack" aria-controls="p-attack" data-k="attack"><span class="n">3</span>攻めてみる</button><button class="tab" role="tab" id="tab-holes" aria-controls="p-holes" data-k="holes"><span class="n">4</span>見つけた穴</button><button class="tab" role="tab" id="tab-agent" aria-controls="p-agent" data-k="agent"><span class="n">5</span>エージェント</button><button class="tab" role="tab" id="tab-youki" aria-controls="p-youki" data-k="youki"><span class="n">6</span>youki</button></nav>

    <div class="panel" role="tabpanel" id="p-premise" aria-labelledby="tab-premise" hidden>
    <section id="s-premise">
      <div class="sec-head"><span class="hex"></span><h2>何を守るのか</h2></div>
      <p class="lede">来場者を疑っているわけではありません。<br>それでも、知らない人が書いた YAML と、知らない人が作ったイメージは、信頼できないものとして扱うしかありません。<br>うっかりでも、わざとでも、次の 4 つが起きないようにしました。</p>
      <div class="goals">
        <div class="goal"><b>ほかの人の展示を止めない</b><p>CPU、メモリ、ディスクを 1 つのアプリが使い切らない。隣の namespace に手を出せない。</p></div>
        <div class="goal"><b>ノードとクラスタを渡さない</b><p>コンテナからノードに抜けられない。運営が入れた制限を、中から外せない。</p></div>
        <div class="goal"><b>踏み台にさせない</b><p>スキャン、スパム、クラウドのメタデータや内部ネットワークへの到達を止める。</p></div>
        <div class="goal"><b>運営の秘密を漏らさない</b><p>証明書、管理者のパスワード、VM の認証情報に、来場者の Pod から届かない。</p></div>
      </div>
    </section>

    <section id="s-principles">
      <div class="sec-head"><span class="hex"></span><h2>何を意識したか</h2></div>
      <div class="principles">
        <div class="principle"><h3>CI は親切、クラスタは強制</h3><p>CI は直し方を早く伝えるため。守るのは API サーバと実行時の仕組み。</p></div>
        <div class="principle"><h3>禁止ではなく、許すものを並べる</h3><p>リソース、volume、レジストリは使ってよいものだけ。IP 直書きを禁止しても、<code>nip.io</code> で迂回された。</p></div>
        <div class="principle"><h3>書いた時点だけでなく、動き出した後まで</h3><p>Pod の中から API を叩いて、制限を外せないようにする。</p></div>
        <div class="principle"><h3>運営のものは、来場者の PR が届かない場所に</h3><p>quota や NetworkPolicy は、運営のリポジトリから全アプリに入れる。</p></div>
        <div class="principle"><h3>止めるか、記録するか</h3><p>正しいアプリが使わないものは止める。止めると壊れるものは、記録して見張る。</p></div>
        <div class="principle"><h3>Kubernetes の組み込みで書く</h3><p>VAP と MAP の CEL で書き、Gatekeeper や Kyverno を足さない。</p></div>
      </div>
    </section>
    <div class="pager"><button type="button" class="next" data-go="layers">次へ：守りの層</button></div>
    </div>

    <div class="panel" role="tabpanel" id="p-layers" aria-labelledby="tab-layers" hidden>
    <section id="s-layers">
      <div class="sec-head"><span class="hex"></span><h2>守りは 4 つの層</h2></div>
      <p class="lede">YAML がクラスタに入って動くまでに、止める場所が 4 回あります。<br>どこか 1 つが抜けても、後ろの層で止まるようにしました。</p>
      <div class="layers">
        <div class="layer">
          <span class="num">① CI</span>
          <span class="role">早く、優しく伝える</span>
          <p><code>check.py</code> がルールを確かめ、直し方をログに出す。PR の中身を書き換えれば迂回できるので、これだけには頼らない。</p>
        </div>
        <div class="layer">
          <span class="num">② Argo CD</span>
          <span class="role">作れる種類と行き先を決める</span>
          <ul><li>AppProject で、作れる種類を列挙</li><li>行き先は <code>app-&lt;名前&gt;</code> に固定</li><li><code>apps/</code> は YAML だけを読み、CI が見たものをそのまま入れる</li></ul>
        </div>
        <div class="layer">
          <span class="num">③ API サーバ</span>
          <span class="role">クラスタで強制する</span>
          <ul><li>Pod Security の baseline</li><li>VAP で展示に固有のルール</li><li>MAP で seccomp などの既定値</li><li>ResourceQuota と LimitRange</li></ul>
        </div>
        <div class="layer">
          <span class="num">④ 動いている最中</span>
          <span class="role">動き出した後を縛る</span>
          <ul><li>CiliumNetworkPolicy</li><li>Tetragon</li><li>youki と PID の上限</li><li>ノードの nftables</li></ul>
        </div>
      </div>
    </section>

    <section id="s-worlds">
      <div class="sec-head"><span class="hex"></span><h2>YAML で見えるのは、Kubernetes の世界まで</h2></div>
      <p class="lede">YAML で止められるのは、どんなリソースを作るかまでです。<br>コンテナの中でアプリが何をするかは、YAML には書かれていません。<br>そこで、通信、プロセス、資源の使い方を、実行時に縛る仕組みを入れています。</p>
      <div class="worlds">
        <div class="world k8s">
          <span class="tag">Kubernetes の世界</span>
          <h3>YAML に書いてあること</h3>
          <pre><code>image: nginx
    volumes: [emptyDir]
    hostnames: [myapp.showcase…]
    resources: { limits: { cpu: 500m } }</code></pre>
          <ul>
            <li>どの種類のリソースを、どの namespace に作るか</li>
            <li>どのイメージを、どの権限と volume で動かすか</li>
            <li>どのホスト名で公開するか</li>
          </ul>
          <p class="verdict">→ CI、Argo CD、API サーバで止められる</p>
        </div>
        <div class="world app">
          <span class="tag">アプリの世界</span>
          <h3>コンテナの中で起きること</h3>
          <ul>
            <li><code>image: nginx</code> と書いてあっても、中身が nginx とは限らない</li>
            <li>起動してから、どこへ通信するか</li>
            <li>何をダウンロードして、何を実行するか</li>
            <li>CPU、メモリ、ディスク、プロセスをどれだけ使うか</li>
            <li>カーネルに何を頼むか</li>
          </ul>
          <p class="verdict">→ YAML からは見えないので、実行時に縛る</p>
        </div>
      </div>
      <div class="runtime">
        <table>
          <thead><tr><th>アプリがすること</th><th>縛る仕組み</th><th>何をしているか</th></tr></thead>
          <tbody>
            <tr><td>通信する</td><td class="mech">CiliumNetworkPolicy</td><td>外へは DNS、80 番、443 番だけ。隣のアプリ、メタデータサーバ、内部ネットワークには届かない</td></tr>
            <tr><td>プロセスを実行する</td><td class="mech">Tetragon</td><td>すべてのプロセスの実行を、カーネルで記録する</td></tr>
            <tr><td>カーネルに頼む</td><td class="mech">Tetragon、seccomp</td><td>user namespace を作ろうとしたら、その場で止める。seccomp で危ないシステムコールを絞る</td></tr>
            <tr><td>CPU とメモリを使う</td><td class="mech">cgroup、ResourceQuota</td><td>コンテナごとの limits と、アプリごとの合計で縛る</td></tr>
            <tr><td>ディスクを使う</td><td class="mech">ephemeral-storage</td><td>emptyDir とログは 1 アプリ 5Gi まで</td></tr>
            <tr><td>プロセスを増やす</td><td class="mech">PID の上限</td><td>Pod ごとに 1024 まで</td></tr>
            <tr><td>接続を受ける</td><td class="mech">nftables</td><td>送信元の IP ごとに、新しい接続を 1 秒 300 本まで</td></tr>
          </tbody>
        </table>
      </div>
      <div class="skipped">
        <div class="k"><small>入れなかったもの</small>イメージスキャン</div>
        <p>スキャンで分かるのは、知られている脆弱性があるかどうかだけです。<br>この展示はイメージの中身をはじめから信用していないので、脆弱性があってもなくても、縛り方は同じです。</p>
      </div>
    </section>
    <div class="pager"><button type="button" data-go="premise">前へ：前提</button><button type="button" class="next" data-go="attack">次へ：攻めてみる</button></div>
    </div>

    <div class="panel" role="tabpanel" id="p-attack" aria-labelledby="tab-attack" hidden>
    <section id="s-sim">
      <div class="sec-head"><span class="hex"></span><h2>攻撃を選んでみてください</h2></div>
      <p class="lede">展示を開く前に、実際に試した攻め方です。<br>選ぶと、どの層で止まるかと、止めているルールの実物が出ます。</p>
      <div class="sim">
        <div class="picker" id="picker"></div>
        <div class="stage" aria-live="polite">
          <div class="what">
                    <h3 id="a-title"></h3>
            <p id="a-what"></p>
          </div>
          <div>
            <div class="track" id="track">
              <div class="token" id="token" aria-hidden="true"></div>
              <div class="lane" data-k="ci"><span class="lname">① CI</span><span class="state"></span></div>
              <div class="lane" data-k="argo"><span class="lname">② Argo CD</span><span class="state"></span></div>
              <div class="lane" data-k="api"><span class="lname">③ API サーバ</span><span class="state"></span></div>
              <div class="lane" data-k="run"><span class="lname">④ 動いている最中</span><span class="state"></span></div>
            </div>
            <div class="legend" style="margin-top:10px"><span class="s">止める</span><span>この層では見ない</span></div>
          </div>
          <div class="how">
            <ul id="a-how"></ul>
            <p class="why" id="a-why"></p>
          </div>
          <div>
            <pre id="a-code"></pre>
            <p class="src" id="a-src" style="margin-top:6px"></p>
          </div>
        </div>
      </div>
    </section>
    <div class="pager"><button type="button" data-go="layers">前へ：守りの層</button><button type="button" class="next" data-go="holes">次へ：見つけた穴</button></div>
    </div>

    <div class="panel" role="tabpanel" id="p-holes" aria-labelledby="tab-holes" hidden>
    <section id="s-holes">
      <div class="sec-head"><span class="hex"></span><h2>AI エージェントに攻めさせて見つけた穴</h2></div>
      <p class="lede">公開前に、AI エージェント（Claude Code）に来場者の立場で穴を探させました。<br>本当に届いた穴があり、塞いでから公開しています。</p>
      <div class="route" style="margin-top:1.4em" aria-label="穴の探し方"><span class="hop">来場者と同じ権限で YAML を書く</span><i>→</i><span class="hop">本番のクラスタで試す</span><i>→</i><span class="hop bad">届いたら、運営のルールで塞ぐ</span><i>→</i><span class="hop goal">同じ攻撃が止まることを確かめる</span></div>
      <div class="breaches">
        <article class="breach">
          <span class="tag">エージェントが、実際に届かせた</span>
          <h3>Gateway が、ノードの kubelet まで中継してしまった</h3>
          <div class="route" aria-label="通り道"><span class="hop">インターネット</span><i>→</i><span class="hop">Gateway<small>ノードのネットワークで動く</small></span><i>→</i><span class="hop bad">手で書いた EndpointSlice<small>行き先：ノードの 10250 番</small></span><i>→</i><span class="hop goal">kubelet<small>ノードの管理用 API</small></span></div>
          <p class="note"><b>EndpointSlice</b>：Service の転送先の一覧。普段は、selector に合う Pod を Kubernetes が自動で書き込む。selector のない Service なら、人が好きな IP とポートを書ける。</p>
          <div class="fix">
            <div class="why"><b>なぜ通ったか</b><p>Service の行き先を手で書けた。Gateway はノードで動くので、NetworkPolicy がかからない。</p></div>
            <div class="how"><b>どう塞いだか</b><p>EndpointSlice は Kubernetes のコントローラだけが書けるようにした。ExternalName も先に塞いだ。</p></div>
          </div>
        </article>
        <article class="breach">
          <span class="tag">エージェントが、実際に外した</span>
          <h3>YAML は正しいのに、動き出した後に自分で制限を外せた</h3>
          <div class="route" aria-label="通り道"><span class="hop bad">Role<small>自分に cilium.io を許す</small></span><i>→</i><span class="hop">自分の Pod</span><i>→</i><span class="hop">API サーバ</span><i>→</i><span class="hop">NetworkPolicy を上書き</span><i>→</i><span class="hop goal">外へ自由に通信</span></div>
          <div class="fix">
            <div class="why"><b>なぜ通ったか</b><p>Role は来場者に許している。CI は YAML しか見ないので、Pod の中から API を叩く操作は止められない。</p></div>
            <div class="how"><b>どう塞いだか</b><p>来場者の ServiceAccount からは、NetworkPolicy、quota、LimitRange を変えられないようにした。</p></div>
          </div>
        </article>
        <article class="breach">
          <span class="tag">エージェントが、設計のときに指摘した</span>
          <h3>見るだけのはずの人が、DB に SQL を送れる</h3>
          <div class="route" aria-label="通り道"><span class="hop">ログインなしの閲覧者</span><i>→</i><span class="hop bad">Grafana の API<small>/api/ds/query</small></span><i>→</i><span class="hop goal">Grafana の DB</span></div>
          <div class="fix">
            <div class="why"><b>なぜ通ったか</b><p>Grafana は閲覧者にも、データソースへのクエリを許している。</p></div>
            <div class="how"><b>どう塞いだか</b><p>統計だけを読めるロールでつないだ。テーブルの中身、削除、ファイルの読み出しは拒否されることを確かめた。</p></div>
          </div>
        </article>
      </div>

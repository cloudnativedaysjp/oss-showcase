      const box = document.createElement("div");
      box.className = "group";
      box.innerHTML = `<h3>${g}</h3>`;
      ATTACKS.forEach((a, i) => {
        if (a.group !== g) return;
        const b = document.createElement("button");
        b.type = "button";
        b.className = "attack-btn";
        b.id = `attack-${i}`;
        b.setAttribute("aria-pressed", "false");
        b.innerHTML = `<span class="hex"></span><span>${a.title}</span>`;
        b.addEventListener("click", () => show(i));
        box.appendChild(b);
      });
      picker.appendChild(box);
    }

    function show(i) {
      const a = ATTACKS[i];
      document.querySelectorAll(".attack-btn").forEach((b) => b.setAttribute("aria-pressed", String(b.id === `attack-${i}`)));
      $("a-title").textContent = a.title;
      $("a-what").textContent = a.what;
      $("a-how").innerHTML = a.how.map((h) => `<li>${h}</li>`).join("");
      $("a-why").textContent = a.why;
      $("a-code").innerHTML = a.code;
      $("a-src").textContent = a.src;
      const lanes = [...track.querySelectorAll(".lane")];
      lanes.forEach((l) => {
        const s = a.layers[l.dataset.k] || "pass";
        l.dataset.s = s;
        l.querySelector(".state").textContent = STATE_TEXT[s];
      });
      // 攻撃の駒は、最初に止める層まで進む。記録だけなら最後まで進む
      const first = ORDER.findIndex((k) => a.layers[k] === "stop");
      const target = lanes[first === -1 ? lanes.length - 1 : first];
      token.style.left = "0px";
      requestAnimationFrame(() => requestAnimationFrame(() => {
        token.style.left = `${target.offsetLeft + target.offsetWidth / 2 - token.offsetWidth / 2}px`;
      }));
    }
    show(0);
    window.addEventListener("resize", () => {
      const cur = document.querySelector('.attack-btn[aria-pressed="true"]');
      if (cur) show(Number(cur.id.split("-")[1]));
    });

    // タブ。#名前 で開き、← → でも切り替えられる
    const TAB_KEYS = [...document.querySelectorAll(".tab")].map((t) => t.dataset.k);
    function openTab(k, focus) {
      if (!TAB_KEYS.includes(k)) k = TAB_KEYS[0];
      document.querySelectorAll(".tab").forEach((t) => {
        const on = t.dataset.k === k;
        t.setAttribute("aria-selected", String(on));
        t.tabIndex = on ? 0 : -1;
        if (on && focus) t.focus();
      });
      document.querySelectorAll(".panel").forEach((p) => { p.hidden = p.id !== `p-${k}`; });
      // 2 枚目以降のタブでは、見出しだけを小さく残す。開いたらすぐ中身が見える
      document.querySelector(".hero").classList.toggle("compact", k !== TAB_KEYS[0]);
      if (k === "attack") {
        const cur = document.querySelector('.attack-btn[aria-pressed="true"]');
        show(cur ? Number(cur.id.split("-")[1]) : 0);
      }
    }
    // 先に中身を切り替えてからスクロールし、最後に # を書き換える。順番が逆だと、古いタブが一瞬見える
    function go(k) {
      openTab(k);
      window.scrollTo({ top: 0, behavior: "instant" });
      if (location.hash.slice(1) !== k) location.hash = k;
    }
    document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => go(t.dataset.k)));
    document.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => go(b.dataset.go)));
    // 戻るボタンなどで # が変わったときだけ切り替える。go() から来た分は、もう切り替わっている
    window.addEventListener("hashchange", () => {
      const k = location.hash.slice(1);
      const cur = document.querySelector('.tab[aria-selected="true"]');
      if (!cur || cur.dataset.k !== k) openTab(k);
    });
    document.addEventListener("keydown", (e) => {
      if (e.altKey || e.ctrlKey || e.metaKey || !["ArrowLeft", "ArrowRight"].includes(e.key)) return;
      const i = TAB_KEYS.indexOf(document.querySelector('.tab[aria-selected="true"]').dataset.k);
      const j = i + (e.key === "ArrowRight" ? 1 : -1);
      if (j >= 0 && j < TAB_KEYS.length) { e.preventDefault(); go(TAB_KEYS[j]); }
    });
    openTab(location.hash.slice(1));
    </script>

    </body>
    </html>
  nginx.conf: |
    # youki では、コンテナの標準出力と標準エラー出力をユーザーが開き直せない。/dev/stderr を開かずに書く
    worker_processes 1;
    error_log stderr warn;
    pid /tmp/nginx.pid;
    events {
      worker_connections 1024;
    }
    http {
      include /etc/nginx/mime.types;
      access_log off;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        charset utf-8;
      }
    }
kind: ConfigMap

    <div class="panel" role="tabpanel" id="p-youki" aria-labelledby="tab-youki" hidden>
    <section id="s-youki">
      <div class="sec-head"><span class="hex"></span><h2>コンテナランタイムは youki</h2></div>
      <p class="lede">来場者の Pod は、Rust で書かれた youki で動いています。<br>runc と同じ OCI ランタイムですが、細かいところの挙動が違い、準備中に 2 つ踏みました。<br>どちらも、同じイメージと同じユーザーで、ランタイムだけを変えて比べています。</p>
      <div class="diffs">
        <article class="diff">
          <h3>パーミッションが 0750 のバイナリを実行できない</h3>
          <div class="cmp"><table>
            <thead><tr><th>ランタイム</th><th>実行できるかの確かめ方</th><th>0750 のバイナリ</th></tr></thead>
            <tbody>
              <tr><td class="rt">runc</td><td>プロセスの権限で、実行できるかを確かめる</td><td>動く</td></tr>
              <tr class="ng"><td class="rt">youki 0.7.0</td><td>「その他」の実行ビットだけを見る</td><td>拒否される</td></tr>
            </tbody>
          </table></div>
          <div class="what">
            <div><b>踏んだもの</b><p>CloudNativePG の PostgreSQL が起動しない。中で実行する manager のパーミッションが 0750 のため。</p></div>
            <div><b>対処</b><p>CloudNativePG の Pod だけ、runc で動かしている。</p></div>
          </div>
        </article>
        <article class="diff">
          <h3>標準エラー出力を開き直せない</h3>
          <div class="cmp"><table>
            <thead><tr><th>ランタイム</th><th>標準出力と標準エラー出力の持ち主</th><th>UID 101 で /dev/stderr に書く</th></tr></thead>
            <tbody>
              <tr><td class="rt">runc</td><td>コンテナのユーザー（101）に付け替える</td><td>書ける</td></tr>
              <tr class="ng"><td class="rt">youki 0.7.0</td><td>root のまま</td><td>Permission denied</td></tr>
            </tbody>
          </table></div>
          <div class="what">
            <div><b>踏んだもの</b><p>nginx-unprivileged が起動しない。ログを <code>/dev/stderr</code> に書くため。このページ自身が落ちた。</p></div>
            <div><b>対処</b><p>nginx に、標準エラー出力を開き直さずに書く設定を渡した。</p></div>
          </div>
        </article>
      </div>
      <p class="lede" style="margin-top:1.6em">本当は user namespace で root ごと無害にしたかったのですが、youki ではまだ使えず、代わりに Tetragon で止めています。<br>見つけた違いは、再現手順を付けて youki に報告します。</p>
    </section>

# 静的な HTML を nginx で配る
apiVersion: apps/v1
kind: Deployment
metadata:
  name: showcase-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: showcase-platform
  template:
    metadata:
      labels:
        app: showcase-platform
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: nginxinc/nginx-unprivileged:1.30.6-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
          ports:
            - containerPort: 8080
          securityContext:
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            # nginx は一時ファイルと pid を /tmp に書く
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: html
          configMap:
            name: showcase-platform
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: showcase-platform
spec:
  selector:
    app: showcase-platform
  ports:
    - port: 80
      targetPort: 8080

# https://sanposhiho.showcase.cloudnativedays.jp で資料を配信する
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sanposhiho
spec:
  parentRefs:
    - name: showcase
      namespace: gateway
  hostnames:
    - sanposhiho.showcase.cloudnativedays.jp
  rules:
    - backendRefs:
        - name: sanposhiho
          port: 80

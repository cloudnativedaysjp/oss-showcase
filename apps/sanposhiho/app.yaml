# showcase/render.py が生成。静的な資料の配信用テナント。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sanposhiho
spec:
  # キーノートの間、片方が落ちても資料を出し続ける
  replicas: 2
  selector:
    matchLabels:
      app: sanposhiho
  template:
    metadata:
      labels:
        app: sanposhiho
      annotations:
        slides/code-sha256: "56f27d4a6314bfc1f32025fac8f3032a7743bc89e2f4c8ea1dac4429c4b3fa58"
    spec:
      # キーノートで使う。ノードが混んでも、来場者のアプリより先に動かす
      priorityClassName: showcase-keynote
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: node:22-alpine
          command: ["node", "/app/server.js"]
          env:
            - name: PORT
              value: "8080"
          ports:
            - containerPort: 8080
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 20
          # requests と limits を揃えて、ノードが混んでも削られないようにする
          # 更新のときに Pod が一時的に 3 つになっても、namespace の requests の上限（CPU 4 コア）に収まる値にする
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: sanposhiho
---
apiVersion: v1
kind: Service
metadata:
  name: sanposhiho
spec:
  selector:
    app: sanposhiho
  ports:
    - port: 80
      targetPort: 8080

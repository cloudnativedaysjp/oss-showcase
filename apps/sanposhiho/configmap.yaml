      <div class="efforts">
        <div class="effort" data-on="1:dim">
          <div class="q">GPUなどのデバイスをどう割り当てるか</div>
          <h3>DRA<small>Dynamic Resource Allocation</small></h3>
          <div class="foot"><span class="by">WG Device Management</span>
            <span class="ico"><span class="gpu sm"></span><span class="ipod sm"></span></span></div>
        </div>
        <div class="effort" data-on="1:dim">
          <div class="q">推論リクエストをどう振り分けるか</div>
          <h3>Gateway API<br>Inference Extension</h3>
          <div class="foot"><span class="by">SIG Network</span>

      <h2 class="hl" data-s="1">Tech Leadは、その技術的な方向と設計に責任を持つ</h2>
      <div class="siglead">
        <div class="org">
          <div class="sigs">
            <span class="sig">SIG Node</span><span class="sig">SIG Network</span><span class="sig">SIG Storage</span><span class="sig">SIG Apps</span>

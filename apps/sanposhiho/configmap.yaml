          </div>
          <div class="scope">
            <h4>SIG Scheduling</h4>
            <p>Podをどのノードで動かすかを決める</p>
            <div class="projects"><span class="chip">kube-scheduler</span><span class="chip">Kueue</span><span class="chip">descheduler</span><span class="chip">KWOK</span><span class="etc">etc.</span></div>

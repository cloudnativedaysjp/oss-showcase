# Source: grafana/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
automountServiceAccountToken: false
metadata:
  labels:
    helm.sh/chart: grafana-14.4.1
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: grafana
    app.kubernetes.io/version: "13.3.1"
  name: grafana
  namespace: app-grafana
---
# Source: grafana/templates/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: grafana
  namespace: app-grafana
  labels:
    helm.sh/chart: grafana-14.4.1
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: grafana
    app.kubernetes.io/version: "13.3.1"
    app.kubernetes.io/component: admin-secret
type: Opaque
data:
  
  admin-user: "YWRtaW4="
  admin-password: "MU9XQ1NXVWlSOGhUNkF1ZVR5Q1lBWXFqYkRiemJKYWVHMlo4dE1Obw=="
  ldap-toml: ""
---
# Source: grafana/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana
  namespace: app-grafana
  labels:
    helm.sh/chart: grafana-14.4.1
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: grafana
    app.kubernetes.io/version: "13.3.1"
data:
  
  grafana.ini: |
    [analytics]
    check_for_updates = true
    [auth]
    disable_login_form = true
    [auth.anonymous]
    enabled = true
    org_role = Viewer
    [auth.basic]
    enabled = false
    [dashboards]
    default_home_dashboard_path = /var/lib/grafana/dashboards/default/showcase.json
    [log]
    mode = console
    [paths]
    data = /var/lib/grafana/
    logs = /var/log/grafana
    plugins = /var/lib/grafana/plugins
    provisioning = /etc/grafana/provisioning
    [plugins]
    preinstall_auto_update = false
    [server]
    domain = ''
    [unified_storage]
    index_path = /var/lib/grafana-search/bleve
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: TestData
      type: grafana-testdata-datasource
      uid: testdata
    - isDefault: true
      name: Prometheus
      type: prometheus
      uid: prometheus
      url: http://prometheus.app-prometheus.svc:9090
    - jsonData:
        database: app
        postgresVersion: 1800
        sslmode: require
      name: PostgreSQL
      secureJsonData:
        password: $GF_READER_PASSWORD
      type: grafana-postgresql-datasource
      uid: postgres
      url: grafana-db-rw:5432
      user: grafana_reader
  dashboardproviders.yaml: |
    apiVersion: 1
    providers:
    - disableDeletion: true
      editable: false
      name: default
      options:
        path: /var/lib/grafana/dashboards/default
      type: file
  download_dashboards.sh: |
    #!/usr/bin/env sh
    set -eufo pipefail
    mkdir -p /var/lib/grafana/dashboards/default
    mkdir -p /var/lib/grafana/dashboards/default
---
# Source: grafana/templates/dashboards-json-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-default
  namespace: app-grafana
  labels:
    helm.sh/chart: grafana-14.4.1
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: grafana
    app.kubernetes.io/version: "13.3.1"
    dashboard-provider: default
data:
  showcase.json:
    |-
      {
        "title": "OSS Showcase",
        "uid": "showcase",
        "refresh": "10s",
        "time": {
          "from": "now-3h",
          "to": "now"
        },
        "panels": [
          {
            "type": "row",
            "title": "キーノート（資料とコメント）",
            "collapsed": false,
            "gridPos": {
              "x": 0,
              "y": 0,
              "w": 24,
              "h": 1
            },
            "id": 1
          },
          {
            "type": "stat",
            "title": "この期間のリクエスト",
            "description": "画面の期間に、資料とコメントに来たリクエストの数",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "decimals": 0,
                "color": {
                  "mode": "fixed",
                  "fixedColor": "#e4007f"
                }
              }
            },
            "options": {
              "colorMode": "background",
              "graphMode": "area",
              "textMode": "value_and_name",
              "justifyMode": "center",
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ]
              }
            },
            "targets": [
              {
                "refId": "A",
                "expr": "sum by (app) (label_replace(increase(envoy_cluster_upstream_rq_xx{envoy_cluster_name=~\"gateway/.+/app-(sanposhiho|comments)_.+\"}[$__range]), \"app\", \"$1\", \"envoy_cluster_name\", \"gateway/[^/]+/app-([^_]+)_.+\"))",
                "instant": false,
                "legendFormat": "{{app}}"
              }
            ],
            "gridPos": {
              "x": 0,
              "y": 1,
              "w": 6,
              "h": 7
            },
            "id": 2
          },
          {
            "type": "stat",
            "title": "いちばん混んだ瞬間（回/秒）",
            "description": "画面の期間で、1 秒あたりのリクエストがいちばん多かったとき",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "decimals": 0,
                "color": {
                  "mode": "fixed",
                  "fixedColor": "#1f60c4"
                }
              }
            },
            "options": {
              "colorMode": "background",
              "graphMode": "area",
              "textMode": "value_and_name",
              "justifyMode": "center",
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ]
              }
            },
            "targets": [
              {
                "refId": "A",
                "expr": "max_over_time((sum by (app) (label_replace(rate(envoy_cluster_upstream_rq_xx{envoy_cluster_name=~\"gateway/.+/app-(sanposhiho|comments)_.+\"}[30s]), \"app\", \"$1\", \"envoy_cluster_name\", \"gateway/[^/]+/app-([^_]+)_.+\")))[$__range:15s])",
                "instant": false,
                "legendFormat": "{{app}}"
              }
            ],
            "gridPos": {
              "x": 6,
              "y": 1,
              "w": 6,
              "h": 7
            },
            "id": 3
          },
          {
            "type": "timeseries",
            "title": "リクエスト（回/秒）",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "reqps",
                "custom": {
                  "fillOpacity": 15,
                  "lineWidth": 2,
                  "stacking": {
                    "mode": "none"
                  }
                }
              }
            },
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom"
              }
            },
            "targets": [
              {
                "refId": "A",
                "expr": "sum by (app) (label_replace(rate(envoy_cluster_upstream_rq_xx{envoy_cluster_name=~\"gateway/.+/app-(sanposhiho|comments)_.+\"}[30s]), \"app\", \"$1\", \"envoy_cluster_name\", \"gateway/[^/]+/app-([^_]+)_.+\"))",
                "legendFormat": "{{app}}"
              }
            ],
            "gridPos": {
              "x": 12,
              "y": 1,
              "w": 12,
              "h": 7
            },
            "id": 4
          },
          {
            "type": "timeseries",
            "title": "ステータスコード（回/秒）",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "reqps",
                "custom": {
                  "fillOpacity": 40,
                  "lineWidth": 2,
                  "stacking": {
                    "mode": "normal"
                  }
                }
              }
            },
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom"
              }
            },
            "targets": [
              {
                "refId": "A",
                "legendFormat": "{{app}} {{envoy_response_code_class}}xx",
                "expr": "sum by (app, envoy_response_code_class) (label_replace(rate(envoy_cluster_upstream_rq_xx{envoy_cluster_name=~\"gateway/.+/app-(sanposhiho|comments)_.+\"}[30s]), \"app\", \"$1\", \"envoy_cluster_name\", \"gateway/[^/]+/app-([^_]+)_.+\"))"
              }
            ],
            "gridPos": {
              "x": 0,
              "y": 8,
              "w": 8,
              "h": 8
            },
            "id": 5
          },
          {
            "type": "timeseries",
            "title": "応答時間（p50 と p95）",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "ms",
                "custom": {
                  "fillOpacity": 15,
                  "lineWidth": 2,
                  "stacking": {
                    "mode": "none"
                  }
                }
              }
            },
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom"
              }
            },
            "targets": [
              {
                "refId": "A",
                "legendFormat": "{{app}} p50",
                "expr": "histogram_quantile(0.5, sum by (le, app) (label_replace(rate(envoy_cluster_upstream_rq_time_bucket{envoy_cluster_name=~\"gateway/.+/app-(sanposhiho|comments)_.+\"}[1m]), \"app\", \"$1\", \"envoy_cluster_name\", \"gateway/[^/]+/app-([^_]+)_.+\")))"
              },
              {
                "refId": "B",
                "legendFormat": "{{app}} p95",
                "expr": "histogram_quantile(0.95, sum by (le, app) (label_replace(rate(envoy_cluster_upstream_rq_time_bucket{envoy_cluster_name=~\"gateway/.+/app-(sanposhiho|comments)_.+\"}[1m]), \"app\", \"$1\", \"envoy_cluster_name\", \"gateway/[^/]+/app-([^_]+)_.+\")))"
              }
            ],
            "gridPos": {
              "x": 8,
              "y": 8,
              "w": 8,
              "h": 8
            },
            "id": 6
          },
          {
            "type": "timeseries",
            "title": "処理中のリクエストと CPU",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "custom": {
                  "fillOpacity": 15,
                  "lineWidth": 2,
                  "stacking": {
                    "mode": "none"
                  }
                }
              }
            },
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom"
              }
            },
            "targets": [
              {
                "refId": "A",
                "legendFormat": "{{app}} 処理中",
                "expr": "sum by (app) (label_replace(envoy_cluster_upstream_rq_active{envoy_cluster_name=~\"gateway/.+/app-(sanposhiho|comments)_.+\"}, \"app\", \"$1\", \"envoy_cluster_name\", \"gateway/[^/]+/app-([^_]+)_.+\"))"
              },
              {
                "refId": "B",
                "legendFormat": "{{app}} CPU（コア）",
                "expr": "label_replace(sum by (namespace) (rate(container_cpu_usage_seconds_total{namespace=~\"app-(sanposhiho|comments)\", container!=\"\"}[1m])), \"app\", \"$1\", \"namespace\", \"app-(.*)\")"
              }
            ],
            "gridPos": {
              "x": 16,
              "y": 8,
              "w": 8,
              "h": 8
            },
            "id": 7
          },
          {
            "type": "row",
            "title": "防いだ攻撃（この 24 時間）",
            "collapsed": false,
            "gridPos": {
              "x": 0,
              "y": 16,
              "w": 24,
              "h": 1
            },
            "id": 8
          },
          {
            "type": "stat",
            "title": "API サーバで門前払い",
            "description": "ValidatingAdmissionPolicy と Pod Security が拒否した YAML の数",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "decimals": 0,
                "color": {
                  "mode": "fixed",
                  "fixedColor": "#e02f44"
                }
              }
            },
            "options": {
              "colorMode": "background",
              "graphMode": "area",
              "textMode": "value",
              "justifyMode": "center",
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ]
              }
            },
            "targets": [
              {
                "refId": "A",
                "expr": "(sum(increase(apiserver_validating_admission_policy_check_total{policy=~\"showcase-.+\", enforcement_action=\"deny\"}[1d])) or vector(0)) + (sum(increase(apiserver_admission_controller_admission_duration_seconds_count{name=\"PodSecurity\", rejected=\"true\"}[1d])) or vector(0))",
                "instant": false
              }
            ],
            "gridPos": {
              "x": 0,
              "y": 17,
              "w": 6,
              "h": 7
            },
            "id": 9
          },
          {
            "type": "stat",
            "title": "NetworkPolicy で落とした通信",
            "description": "CiliumNetworkPolicy が落としたパケットの数",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "decimals": 0,
                "color": {
                  "mode": "fixed",
                  "fixedColor": "#8f3bb8"
                }
              }
            },
            "options": {
              "colorMode": "background",
              "graphMode": "area",
              "textMode": "value",
              "justifyMode": "center",
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ]
              }
            },
            "targets": [
              {
                "refId": "A",
                "expr": "(sum(increase(cilium_drop_count_total{reason=~\"Policy denied.*\"}[1d])) or vector(0))",
                "instant": false
              }
            ],
            "gridPos": {
              "x": 6,
              "y": 17,
              "w": 6,
              "h": 7
            },
            "id": 10
          },
          {
            "type": "stat",
            "title": "user namespace を阻止",
            "description": "Tetragon が user namespace を作ろうとしたプロセスを止めた回数",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "decimals": 0,
                "color": {
                  "mode": "fixed",
                  "fixedColor": "#ff7383"
                }
              }
            },
            "options": {
              "colorMode": "background",
              "graphMode": "area",
              "textMode": "value",
              "justifyMode": "center",
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ]
              }
            },
            "targets": [
              {
                "refId": "A",
                "expr": "(sum(increase(tetragon_policy_events_total[1d])) or vector(0))",
                "instant": false
              }
            ],
            "gridPos": {
              "x": 12,
              "y": 17,
              "w": 6,
              "h": 7
            },
            "id": 11
          },
          {
            "type": "stat",
            "title": "/tmp からの実行を発見",
            "description": "/tmp などに置いたファイルを実行した回数。止めずに記録だけしている",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "decimals": 0,
                "color": {
                  "mode": "fixed",
                  "fixedColor": "#fade2a"
                }
              }
            },
            "options": {
              "colorMode": "background",
              "graphMode": "area",
              "textMode": "value",
              "justifyMode": "center",
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ]
              }
            },
            "targets": [
              {
                "refId": "A",
                "expr": "(sum(increase(tetragon_events_total{binary=~\"/(tmp|var/tmp|dev/shm)/.*\"}[1d])) or vector(0))",
                "instant": false
              }
            ],
            "gridPos": {
              "x": 18,
              "y": 17,
              "w": 6,
              "h": 7
            },
            "id": 12
          },
          {
            "type": "bargauge",
            "title": "当たったルール",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "min": 0,
                "color": {
                  "mode": "fixed",
                  "fixedColor": "#e02f44"
                }
              }
            },
            "options": {
              "displayMode": "gradient",
              "orientation": "horizontal",
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ]
              }
            },
            "targets": [
              {
                "refId": "A",
                "instant": true,
                "legendFormat": "{{policy}}",
                "expr": "sort_desc(sum by (policy) (increase(apiserver_validating_admission_policy_check_total{policy=~\"showcase-.+\", enforcement_action=\"deny\"}[1d])) > 0)"
              },
              {
                "refId": "B",
                "instant": true,
                "legendFormat": "Pod Security",
                "expr": "sum(increase(apiserver_admission_controller_admission_duration_seconds_count{name=\"PodSecurity\", rejected=\"true\"}[1d])) > 0"
              }
            ],
            "gridPos": {
              "x": 0,
              "y": 24,
              "w": 10,
              "h": 8
            },
            "id": 13
          },
          {
            "type": "timeseries",
            "title": "攻撃のタイムライン（1 分ごと）",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "custom": {
                  "fillOpacity": 15,
                  "lineWidth": 2,
                  "stacking": {
                    "mode": "none"
                  },
                  "drawStyle": "bars"
                }
              }
            },
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom"
              }
            },
            "targets": [
              {
                "refId": "A",
                "expr": "sum(increase(apiserver_validating_admission_policy_check_total{policy=~\"showcase-.+\", enforcement_action=\"deny\"}[1m])) + sum(increase(apiserver_admission_controller_admission_duration_seconds_count{name=\"PodSecurity\", rejected=\"true\"}[1m]))",
                "legendFormat": "門前払い"
              },
              {
                "refId": "B",
                "expr": "sum(increase(cilium_drop_count_total{reason=~\"Policy denied.*\"}[1m]))",
                "legendFormat": "落とした通信"
              },
              {
                "refId": "C",
                "expr": "sum(increase(tetragon_policy_events_total[1m]))",
                "legendFormat": "user namespace"
              }
            ],
            "gridPos": {
              "x": 10,
              "y": 24,
              "w": 14,
              "h": 8
            },
            "id": 14
          },
          {
            "type": "row",
            "title": "ノード全体",
            "collapsed": false,
            "gridPos": {
              "x": 0,
              "y": 32,
              "w": 24,
              "h": 1
            },
            "id": 15
          },
          {
            "type": "gauge",
            "title": "CPU",
            "description": "ノードの CPU のうち、使っている割合",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "percentunit",
                "min": 0,
                "max": 1,
                "decimals": 0,
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    },
                    {
                      "color": "orange",
                      "value": 0.7
                    },
                    {
                      "color": "red",
                      "value": 0.9
                    }
                  ]
                }
              }
            },
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ]
              },
              "showThresholdMarkers": true
            },
            "targets": [
              {
                "refId": "A",
                "expr": "sum(rate(container_cpu_usage_seconds_total{id=\"/\"}[2m])) / max(machine_cpu_cores)"
              }
            ],
            "gridPos": {
              "x": 0,
              "y": 33,
              "w": 4,
              "h": 7
            },
            "id": 16
          },
          {
            "type": "gauge",
            "title": "メモリ",
            "description": "ノードのメモリのうち、使っている割合。ページキャッシュは含まない",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "percentunit",
                "min": 0,
                "max": 1,
                "decimals": 0,
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    },
                    {
                      "color": "orange",
                      "value": 0.7
                    },
                    {
                      "color": "red",
                      "value": 0.9
                    }
                  ]
                }
              }
            },
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ]
              },
              "showThresholdMarkers": true
            },
            "targets": [
              {
                "refId": "A",
                "expr": "sum(container_memory_working_set_bytes{id=\"/\"}) / max(machine_memory_bytes)"
              }
            ],
            "gridPos": {
              "x": 4,
              "y": 33,
              "w": 4,
              "h": 7
            },
            "id": 17
          },
          {
            "type": "gauge",
            "title": "ディスク",
            "description": "ノードの root ディスクの使用率",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "percentunit",
                "min": 0,
                "max": 1,
                "decimals": 0,
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    },
                    {
                      "color": "orange",
                      "value": 0.7
                    },
                    {
                      "color": "red",
                      "value": 0.9
                    }
                  ]
                }
              }
            },
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ]
              },
              "showThresholdMarkers": true
            },
            "targets": [
              {
                "refId": "A",
                "expr": "sum(container_fs_usage_bytes{id=\"/\", device=~\"/dev/(vd|sd|nvme)[a-z]+1\"}) / sum(container_fs_limit_bytes{id=\"/\", device=~\"/dev/(vd|sd|nvme)[a-z]+1\"})"
              }
            ],
            "gridPos": {
              "x": 8,
              "y": 33,
              "w": 4,
              "h": 7
            },
            "id": 18
          },
          {
            "type": "gauge",
            "title": "PVC の置き場",
            "description": "PVC を置くループデバイスの使用率。全部のアプリで分け合う",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "percentunit",
                "min": 0,
                "max": 1,
                "decimals": 0,
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {
                      "color": "green",
                      "value": null
                    },
                    {
                      "color": "orange",
                      "value": 0.7
                    },
                    {
                      "color": "red",
                      "value": 0.9
                    }
                  ]
                }
              }
            },
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ]
              },
              "showThresholdMarkers": true
            },
            "targets": [
              {
                "refId": "A",
                "expr": "sum(container_fs_usage_bytes{id=\"/\", device=~\"/dev/loop.*\"}) / sum(container_fs_limit_bytes{id=\"/\", device=~\"/dev/loop.*\"})"
              }
            ],
            "gridPos": {
              "x": 12,
              "y": 33,
              "w": 4,
              "h": 7
            },
            "id": 19
          },
          {
            "type": "timeseries",
            "title": "CPU とメモリの使用率",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "percentunit",
                "custom": {
                  "fillOpacity": 15,
                  "lineWidth": 2,
                  "stacking": {
                    "mode": "none"
                  }
                }
              }
            },
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom"
              }
            },
            "targets": [
              {
                "refId": "A",
                "expr": "sum(rate(container_cpu_usage_seconds_total{id=\"/\"}[2m])) / max(machine_cpu_cores)",
                "legendFormat": "CPU"
              },
              {
                "refId": "B",
                "expr": "sum(container_memory_working_set_bytes{id=\"/\"}) / max(machine_memory_bytes)",
                "legendFormat": "メモリ"
              }
            ],
            "gridPos": {
              "x": 16,
              "y": 33,
              "w": 8,
              "h": 7
            },
            "id": 20
          },
          {
            "type": "row",
            "title": "アプリのランキング",
            "collapsed": false,
            "gridPos": {
              "x": 0,
              "y": 40,
              "w": 24,
              "h": 1
            },
            "id": 21
          },
          {
            "type": "bargauge",
            "title": "働き者（CPU）",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "min": 0,
                "color": {
                  "mode": "fixed",
                  "fixedColor": "#73bf69"
                }
              }
            },
            "options": {
              "displayMode": "lcd",
              "orientation": "horizontal",
              "showUnfilled": true,
              "valueMode": "color",
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ]
              }
            },
            "targets": [
              {
                "refId": "A",

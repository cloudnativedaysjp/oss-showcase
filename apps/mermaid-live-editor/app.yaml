apiVersion: apps/v1
kind: Deployment
metadata:
  name: mermaid-live-editor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mermaid-live-editor
  template:
    metadata:
      labels:
        app: mermaid-live-editor
    spec:
      containers:
        - name: mermaid-live-editor
          image: ghcr.io/mermaid-js/mermaid-live-editor:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mermaid-live-editor
spec:
  selector:
    app: mermaid-live-editor
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mermaid-live-editor
spec:
  parentRefs:
    - name: showcase
      namespace: gateway
  hostnames:
    - mermaid-live-editor.showcase.cloudnativedays.jp
  rules:
    - backendRefs:
        - name: mermaid-live-editor
          port: 80
